name: ReefVision 1.0.1 Live SAM Acceptance

# Separate from fast source tests and offline MSI checks because this job
# intentionally downloads a real ~156 MB upstream SAM 2.1 Tiny checkpoint.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/reefvision-101-live-sam.yml"
      - "apps/api/reefvision/tests/test_patch_101_live_sam2_acceptance.py"
      - "apps/api/reefvision/services/sam2_install.py"
      - "apps/api/reefvision/services/advanced_provider_execution.py"
      - "apps/api/reefvision/services/advanced_provider_proposals.py"
      - "pyproject.toml"

concurrency:
  group: reefvision-101-live-sam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-sam2-download-and-inference:
    name: Real checkpoint download, CPU inference, and provenance review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REEFVISION_LIVE_SAM2_ACCEPTANCE: "1"
      REEFVISION_ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/sam2-live-evidence
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ReefVision advanced inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,advanced]"
      - name: Download actual SAM 2.1 Tiny and run prompted image inference
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_patch_101_live_sam2_acceptance.py
          -q -s
      - name: Upload live SAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.1-sam2-live-evidence
          path: sam2-live-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
