name: Milestone 7 Acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  active-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 7 Python
        run: |
          python -m ruff check \
            apps/api/migrations/versions/0022_active_learning_rounds.py \
            apps/api/reefvision/api/routes/active_learning.py \
            apps/api/reefvision/db/models/active_learning_round.py \
            apps/api/reefvision/schemas/active_learning.py \
            apps/api/reefvision/services/active_learning_rounds.py \
            apps/api/reefvision/tests/test_active_learning_phase7.py
          python -m ruff format --check \
            apps/api/migrations/versions/0022_active_learning_rounds.py \
            apps/api/reefvision/api/routes/active_learning.py \
            apps/api/reefvision/db/models/active_learning_round.py \
            apps/api/reefvision/schemas/active_learning.py \
            apps/api/reefvision/services/active_learning_rounds.py \
            apps/api/reefvision/tests/test_active_learning_phase7.py
      - name: Run Milestone 7 active learning tests
        run: python -m pytest apps/api/reefvision/tests/test_active_learning_phase7.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check active-learning desktop workspace
        working-directory: apps/web
        run: |
          npx prettier --check \
            src/features/active-learning/ActiveLearningWorkspace.tsx \
            src/features/active-learning/activeLearningApi.ts
          npm run typecheck
      - name: Verify 0022 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-m7"
          mkdir -p "$REEFVISION_DATA_ROOT"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0021
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          assert scripts.get_heads() == ['0022'], scripts.get_heads()
          PY
