name: Milestone 2 Release Polish

on:
  pull_request:
    paths:
      - ".github/workflows/milestone2-release-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply cross-platform PATH and E2E locator fixes
        shell: python
        run: |
          from pathlib import Path

          system = Path("apps/api/reefvision/services/system.py")
          text = system.read_text(encoding="utf-8")
          old = '''    def _user_path_entries(self) -> set[str]:\n        raw = os.environ.get("Path") or os.environ.get("PATH") or ""\n        return {entry.strip() for entry in raw.split(";") if entry.strip()}\n'''
          new = '''    def _user_path_entries(self) -> set[str]:\n        path_values = [\n            value for key, value in os.environ.items() if key.casefold() == "path"\n        ]\n        raw = path_values[-1] if path_values else ""\n        return {entry.strip() for entry in raw.split(";") if entry.strip()}\n'''
          if old not in text:
              raise SystemExit("Expected mixed-case PATH lookup was not found")
          system.write_text(text.replace(old, new, 1), encoding="utf-8")

          e2e = Path("apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts")
          text = e2e.read_text(encoding="utf-8")
          old = '''  await page.keyboard.press("d");\n  await expect(\n    page.getByRole("heading", { name: "swiftia-day90.png" }),\n  ).toBeVisible();\n  await page.keyboard.press("a");\n  await expect(\n    page.getByRole("heading", { name: "swiftia-day0.png" }),\n  ).toBeVisible();\n'''
          new = '''  await page.keyboard.press("d");\n  await expect(\n    page\n      .getByTestId("annotation-editor")\n      .getByRole("heading", { name: "swiftia-day90.png" }),\n  ).toBeVisible();\n  await page.keyboard.press("a");\n  await expect(\n    page\n      .getByTestId("annotation-editor")\n      .getByRole("heading", { name: "swiftia-day0.png" }),\n  ).toBeVisible();\n'''
          if old not in text:
              raise SystemExit("Expected unscoped navigation headings were not found")
          e2e.write_text(text.replace(old, new, 1), encoding="utf-8")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.2
      - run: python -m ruff check apps/api/reefvision/services/system.py
      - run: python -m ruff format apps/api/reefvision/services/system.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write tests/e2e/milestone2-mask-acceptance.spec.ts
        working-directory: apps/web
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/reefvision/services/system.py \
                  apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts
          git commit -m "Polish final Milestone 2 release checks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
