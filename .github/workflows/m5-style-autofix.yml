name: M5 Style Autofix

on:
  push:
    branches:
      - integration/milestone5-classification
    paths:
      - ".github/workflows/m5-style-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/milestone5-classification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply exact classification lint repairs
        shell: python
        run: |
          from pathlib import Path

          p = Path("apps/api/reefvision/jobs/classification_inference.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'job.error_message = "One or more classification images were not found in the model project"',
              'job.error_message = (\n                "One or more classification images were not found in the model project"\n            )',
          )
          p.write_text(text, encoding="utf-8")

          p = Path("apps/api/reefvision/jobs/classification_training.py")
          text = p.read_text(encoding="utf-8").replace("from pathlib import Path\n", "")
          p.write_text(text, encoding="utf-8")

          p = Path("apps/api/reefvision/services/classification_datasets.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'raise ValidationError("Classification source image no longer matches its snapshot")',
              'raise ValidationError(\n                        "Classification source image no longer matches its snapshot"\n                    )',
          )
          text = text.replace(
              '"Whole-image classification requires exactly one verified label "',
              '"Whole-image classification requires exactly one "\n                            "verified label "',
          )
          text = text.replace(
              'f"in label set \'{payload.label_set}\' for {item.original_filename}"',
              'f"in label set \'{payload.label_set}\' "\n                            f"for {item.original_filename}"',
          )
          p.write_text(text, encoding="utf-8")
      - name: Format and verify Python
        run: |
          python -m pip install ruff==0.16.2
          python -m ruff format \
            apps/api/reefvision/jobs/classification_inference.py \
            apps/api/reefvision/jobs/classification_training.py \
            apps/api/reefvision/ml/classification.py \
            apps/api/reefvision/services/classification_datasets.py
          python -m ruff check \
            apps/api/reefvision/api/routes/classification.py \
            apps/api/reefvision/jobs/classification_inference.py \
            apps/api/reefvision/jobs/classification_training.py \
            apps/api/reefvision/ml/classification.py \
            apps/api/reefvision/schemas/classification.py \
            apps/api/reefvision/services/classification_datasets.py \
            apps/api/reefvision/services/classification_labels.py \
            apps/api/reefvision/services/classification_predictions.py \
            apps/api/reefvision/tests/test_classification_phase5.py
      - run: npm --prefix apps/web ci
      - name: Format classification and inherited measurement UI
        run: |
          npx --prefix apps/web prettier --write \
            apps/web/src/App.tsx \
            apps/web/src/features/annotation-editor/CenterlineMeasurementLayer.tsx \
            apps/web/src/features/annotation-editor/MaskMeasurementPanel.tsx \
            apps/web/src/features/annotation-editor/maskMeasurementsApi.ts \
            apps/web/src/features/classification/ClassificationWorkspace.test.tsx \
            apps/web/src/features/classification/ClassificationWorkspace.tsx
          npm --prefix apps/web run format:check
      - name: Commit style repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/reefvision apps/web/src
          git commit -m "Normalize Milestone 5 classification style" || exit 0
          git push origin HEAD:integration/milestone5-classification