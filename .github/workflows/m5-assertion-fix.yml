name: M5 Assertion Fix

on:
  push:
    branches:
      - integration/milestone5-classification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize classification assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/reefvision/tests/test_classification_phase5.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert all(sample["crop_bounds"] is None for sample in image_payload["manifest_json"]["samples"])\n'
          new = '    samples = image_payload["manifest_json"]["samples"]\n    assert all(sample["crop_bounds"] is None for sample in samples)\n'
          if old not in text:
              raise SystemExit('Expected classification assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/reefvision/tests/test_classification_phase5.py
          git commit -m 'Normalize classification dataset assertion'
          git push
