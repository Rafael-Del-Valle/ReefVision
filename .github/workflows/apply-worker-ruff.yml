name: Apply Worker Lint Fix

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-worker-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.9,<1"
      - name: Apply Ruff fixes
        run: |
          python -m ruff check --fix \
            apps/api/reefvision/api/routes/model_catalog.py \
            apps/api/reefvision/jobs/model_install.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/tests/test_worker_resilience.py
          python -m ruff format \
            apps/api/reefvision/api/routes/model_catalog.py \
            apps/api/reefvision/jobs/model_install.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/tests/test_worker_resilience.py
          python -m ruff check \
            apps/api/reefvision/api/routes/model_catalog.py \
            apps/api/reefvision/jobs/model_install.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/tests/test_worker_resilience.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/reefvision/api/routes/model_catalog.py \
            apps/api/reefvision/jobs/model_install.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/tests/test_worker_resilience.py
          git commit -m "Format worker resilience changes"
          git push origin HEAD:fix/model-install-worker
