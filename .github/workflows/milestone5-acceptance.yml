name: Milestone 5 Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/milestone5-acceptance.yml"
      - "apps/api/migrations/**"
      - "apps/api/reefvision/api/routes/classification.py"
      - "apps/api/reefvision/db/models/classification_*.py"
      - "apps/api/reefvision/db/models/image_label.py"
      - "apps/api/reefvision/jobs/classification_*.py"
      - "apps/api/reefvision/ml/classification.py"
      - "apps/api/reefvision/schemas/classification.py"
      - "apps/api/reefvision/services/classification_*.py"
      - "apps/api/reefvision/tests/test_classification_phase5.py"
      - "apps/web/src/features/classification/**"
      - "scripts/phase5-acceptance.ps1"
  workflow_dispatch:

jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 5 Python
        run: |
          python -m ruff check \
            apps/api/reefvision/api/routes/classification.py \
            apps/api/reefvision/jobs/classification_inference.py \
            apps/api/reefvision/jobs/classification_training.py \
            apps/api/reefvision/ml/classification.py \
            apps/api/reefvision/schemas/classification.py \
            apps/api/reefvision/services/classification_datasets.py \
            apps/api/reefvision/services/classification_labels.py \
            apps/api/reefvision/services/classification_predictions.py \
            apps/api/reefvision/tests/test_classification_phase5.py
          python -m ruff format --check \
            apps/api/reefvision/api/routes/classification.py \
            apps/api/reefvision/jobs/classification_inference.py \
            apps/api/reefvision/jobs/classification_training.py \
            apps/api/reefvision/ml/classification.py \
            apps/api/reefvision/schemas/classification.py \
            apps/api/reefvision/services/classification_datasets.py \
            apps/api/reefvision/services/classification_labels.py \
            apps/api/reefvision/services/classification_predictions.py \
            apps/api/reefvision/tests/test_classification_phase5.py
      - name: Run Milestone 5 classification tests
        run: |
          python -m pytest apps/api/reefvision/tests/test_classification_phase5.py
      - name: Verify 0020 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/reefvision-milestone5-migrations"
          alembic -c apps/api/alembic.ini upgrade 0019
          alembic -c apps/api/alembic.ini upgrade 0020
          alembic -c apps/api/alembic.ini downgrade 0019
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini current
