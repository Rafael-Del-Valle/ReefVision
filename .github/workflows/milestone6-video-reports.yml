name: Milestone 6 Video Reports

on:
  pull_request:
  workflow_dispatch:

jobs:
  science-provenance-and-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format calibration provenance backend
        run: |
          python -m ruff check \
            apps/api/reefvision/schemas/video_science.py \
            apps/api/reefvision/services/video_science.py \
            apps/api/reefvision/tests/test_video_calibration_revision_phase6.py
          python -m ruff format --check \
            apps/api/reefvision/schemas/video_science.py \
            apps/api/reefvision/services/video_science.py \
            apps/api/reefvision/tests/test_video_calibration_revision_phase6.py
      - name: Run calibration provenance test
        run: python -m pytest apps/api/reefvision/tests/test_video_calibration_revision_phase6.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check science report serializers and desktop controls
        working-directory: apps/web
        run: |
          npx prettier --check \
            src/features/video/VideoActivityPanel.tsx \
            src/features/video/VideoSciencePanel.tsx \
            src/features/video/videoActivityApi.ts \
            src/features/video/videoScienceApi.ts \
            src/features/video/videoScienceReport.ts \
            src/features/video/videoScienceReport.test.ts
          npm run typecheck
          npx vitest run src/features/video/videoScienceReport.test.ts --config vite.config.mjs --configLoader runner
