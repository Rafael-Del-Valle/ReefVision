name: Apply Web Formatting

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-web-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write package.json package-lock.json src-tauri/tauri.conf.json
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No web formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json apps/web/src-tauri/tauri.conf.json
          git commit -m "Format ReefVision 1.6.1 manifests"
          git push origin HEAD:fix/model-install-worker
