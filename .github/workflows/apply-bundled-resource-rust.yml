name: Apply Bundled Model Resource Runtime Patch

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-bundled-resource-rust.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Pass bundled resources to sidecar and allow first-launch seeding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src-tauri/src/main.rs")
          text = path.read_text(encoding="utf-8")

          old = '''    let executable = packaged_backend_executable(app)?;
    let working_directory = executable.parent().ok_or_else(|| {
'''
          new = '''    let executable = packaged_backend_executable(app)?;
    let resource_dir = app
        .path()
        .resource_dir()
        .map_err(|error| std::io::Error::other(error.to_string()))?;
    let bundled_models = resource_dir.join("bundled-models");
    let bundled_manifest = bundled_models.join("manifest.json");
    if !bundled_manifest.is_file() {
        return Err(std::io::Error::new(
            std::io::ErrorKind::NotFound,
            format!(
                "The ReefVision bundled-model manifest is missing: {}",
                bundled_manifest.display()
            ),
        ));
    }
    let working_directory = executable.parent().ok_or_else(|| {
'''
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one packaged backend block, found {text.count(old)}")
          text = text.replace(old, new)

          old = '''    let child = Command::new(&executable)
        .arg("--host")
'''
          new = '''    let child = Command::new(&executable)
        .env("REEFVISION_BUNDLED_MODELS_DIR", &bundled_models)
        .arg("--host")
'''
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one packaged command block, found {text.count(old)}")
          text = text.replace(old, new)

          old = "wait_for_backend_port(&port_file, Duration::from_secs(20))"
          new = "wait_for_backend_port(&port_file, Duration::from_secs(120))"
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one backend timeout, found {text.count(old)}")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate Rust shell
        working-directory: apps/web/src-tauri
        run: |
          cargo fmt --check || cargo fmt
          cargo check
          cargo test

      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src-tauri/src/main.rs
          git rm .github/workflows/apply-bundled-resource-rust.yml
          git commit -m "Pass bundled model resources to desktop backend"
          git push origin HEAD:fix/model-install-worker
