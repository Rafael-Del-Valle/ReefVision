name: Format Bundled Model Python

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/format-bundled-model-python.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: python -m pip install "ruff>=0.9,<1"

      - name: Format Python source
        run: python -m ruff format apps/api

      - name: Verify lint and formatting
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git rm .github/workflows/format-bundled-model-python.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format bundled model Python source"
          git push origin HEAD:fix/model-install-worker
