name: Milestone 6 Acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  video-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 6 Python
        run: |
          python -m ruff check \
            apps/api/migrations/versions/0021_video_tracking_workflows.py \
            apps/api/reefvision/api/routes/videos.py \
            apps/api/reefvision/jobs/video.py \
            apps/api/reefvision/jobs/video_tracking.py \
            apps/api/reefvision/ml/video_tracking.py \
            apps/api/reefvision/schemas/videos.py \
            apps/api/reefvision/services/video_assets.py \
            apps/api/reefvision/services/video_tracking_evaluation.py \
            apps/api/reefvision/services/video_tracks.py \
            apps/api/reefvision/tests/test_video_tracking_evaluation_phase6.py \
            apps/api/reefvision/tests/test_video_tracking_phase6.py
          python -m ruff format --check \
            apps/api/migrations/versions/0021_video_tracking_workflows.py \
            apps/api/reefvision/api/routes/videos.py \
            apps/api/reefvision/jobs/video.py \
            apps/api/reefvision/jobs/video_tracking.py \
            apps/api/reefvision/ml/video_tracking.py \
            apps/api/reefvision/schemas/videos.py \
            apps/api/reefvision/services/video_assets.py \
            apps/api/reefvision/services/video_tracking_evaluation.py \
            apps/api/reefvision/services/video_tracks.py \
            apps/api/reefvision/tests/test_video_tracking_evaluation_phase6.py \
            apps/api/reefvision/tests/test_video_tracking_phase6.py
      - name: Run Milestone 6 video tracking tests
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_video_tracking_phase6.py
          apps/api/reefvision/tests/test_video_tracking_evaluation_phase6.py
          -q
      - name: Verify 0021 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-m6"
          mkdir -p "$REEFVISION_DATA_ROOT"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0020
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          assert scripts.get_heads() == ['0021'], scripts.get_heads()
          PY
