name: M4 Centerline Prettier

on:
  push:
    branches:
      - integration/milestone4-measurements

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - name: Format centerline layer
        run: npx --prefix apps/web prettier --write apps/web/src/features/annotation-editor/CenterlineMeasurementLayer.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/annotation-editor/CenterlineMeasurementLayer.tsx
          git commit -m 'Format centerline measurement layer'
          git push
