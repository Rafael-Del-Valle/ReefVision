name: Milestone 2 Final Fix

on:
  pull_request:
    paths:
      - ".github/workflows/milestone2-final-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply release-suite fixes
        shell: python
        run: |
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = '  "opencv-python-headless>=4.10,<5",\n'
          new = '  "ultralytics==8.3.228",\n'
          if old not in text:
              raise SystemExit("Expected headless OpenCV dev dependency was not found")
          pyproject.write_text(text.replace(old, new, 1), encoding="utf-8")

          system = Path("apps/api/reefvision/services/system.py")
          text = system.read_text(encoding="utf-8")
          old = '        raw = os.environ.get("PATH") or ""\n'
          new = '        raw = os.environ.get("Path") or os.environ.get("PATH") or ""\n'
          if old not in text:
              raise SystemExit("Expected PATH lookup was not found")
          system.write_text(text.replace(old, new, 1), encoding="utf-8")

          e2e = Path("apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts")
          text = e2e.read_text(encoding="utf-8")
          old = '''  await page.mouse.click(polygonBox.x + polygonBox.width / 2, polygonBox.y + 2);\n  await page.getByTestId("move-polygon-nodes").click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(5);\n\n  await page.getByTestId("delete-polygon-node").click();\n  await page.locator(`[data-testid^="mask-vertex-${maskId}-"]`).last().click();\n  await page.getByTestId("move-polygon-nodes").click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(4);\n'''
          new = '''  await page.mouse.click(polygonBox.x + polygonBox.width / 2, polygonBox.y + 2);\n  const selectedPolygon = layer.locator(`g[data-mask-id="${maskId}"] polygon`);\n  const polygonPointCount = async () => {\n    const points = await selectedPolygon.getAttribute("points");\n    return points?.trim().split(/\\s+/).filter(Boolean).length ?? 0;\n  };\n  await expect.poll(polygonPointCount).toBe(5);\n\n  await page.getByTestId("move-polygon-nodes").click();\n  await selectedPolygon.click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(5);\n\n  await page.getByTestId("delete-polygon-node").click();\n  await page.locator(`[data-testid^="mask-vertex-${maskId}-"]`).last().click();\n  await expect.poll(polygonPointCount).toBe(4);\n  await page.getByTestId("move-polygon-nodes").click();\n  await selectedPolygon.click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(4);\n'''
          if old not in text:
              raise SystemExit("Expected Milestone 2 insert/delete E2E block was not found")
          e2e.write_text(text.replace(old, new, 1), encoding="utf-8")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.2
      - run: python -m ruff format apps/api/reefvision/services/system.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write tests/e2e/milestone2-mask-acceptance.spec.ts
        working-directory: apps/web
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml \
                  apps/api/reefvision/services/system.py \
                  apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts
          git commit -m "Fix final Milestone 2 release-suite failures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
