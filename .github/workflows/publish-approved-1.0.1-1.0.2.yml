name: Publish approved ReefVision 1.0.1 and 1.0.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-approved-1.0.1-1.0.2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: reefvision-approved-1.0.1-1.0.2
  cancel-in-progress: false

jobs:
  publish-both:
    name: Publish verified installer packages and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Rafael-Del-Valle/ReefVision
    steps:
      - name: Validate exact build artifacts and publish releases in order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloader"
          gh release download v1.0.1-rc.1 --repo "$REPO" --pattern 'ReefVision_Windows_Downloader.exe' --dir "$RUNNER_TEMP/downloader"
          echo '31144f04be2ecbdff356efbe3ae873b8fc4c4867d106c14008c0fc37b0c5e8d1  '"$RUNNER_TEMP/downloader/ReefVision_Windows_Downloader.exe" | sha256sum --check -

          for VERSION in 1.0.1 1.0.2; do
            if [[ "$VERSION" == 1.0.1 ]]; then
              RUN_ID=38504299088
              SOURCE_SHA=865cf07207c48c873ea3ac223010679402e0f83b
              TITLE="ReefVision 1.0.1 — Scientific evaluation and SAM annotation"
            else
              RUN_ID=38504438760
              SOURCE_SHA=73b1b8ed1aa3b45389ec4b82f49e694f2d11d99b
              TITLE="ReefVision 1.0.2 — Annotation usability and scientific integration"
            fi
            TAG="v$VERSION"
            echo "Preparing $TAG from passed build $RUN_ID ($SOURCE_SHA)"
            test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
            test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists; refusing to overwrite"
              exit 1
            fi
            STAGE="$RUNNER_TEMP/$TAG"
            mkdir -p "$STAGE"
            gh run download "$RUN_ID" --repo "$REPO" --name reefvision-1.0-windows-msi --dir "$STAGE"
            export STAGE VERSION SOURCE_SHA
            python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          stage = Path(os.environ["STAGE"])
          manifests = list(stage.rglob("build-provenance.json"))
          assert len(manifests) == 1, f"Expected one provenance file; found {len(manifests)}"
          root = manifests[0].parent
          manifest = json.loads(manifests[0].read_text(encoding="utf-8-sig"))
          version = os.environ["VERSION"]
          assert manifest["version"] == version
          assert manifest["source_commit"] == os.environ["SOURCE_SHA"]
          assert manifest["source_tree_clean"] is True and manifest["msi_verified"] is True
          records = manifest["files"]
          names = [r["name"] for r in records]
          cabs = sorted(int(m.group(1)) for n in names
                        if (m := re.fullmatch(r"rv([1-9]\d*)\.cab", n)))
          assert cabs and cabs == list(range(1, len(cabs) + 1))
          assert sorted(names) == sorted([f"ReefVision_{version}_x64_en-US.msi"] +
                                          [f"rv{n}.cab" for n in cabs])
          actual = sorted(p.name for p in root.iterdir()
                          if p.is_file() and p.suffix.lower() in (".msi", ".cab"))
          assert actual == sorted(names), (actual, names)
          for r in records:
              h = hashlib.sha256()
              with (root / r["name"]).open("rb") as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                      h.update(chunk)
              assert h.hexdigest().lower() == r["sha256"].lower(), r["name"]
          print(f"PASS: {version} SHA-256, source, one MSI, {len(cabs)} CAB files.")
          PY
            ASSET_DIR="$(dirname "$(find "$STAGE" -name build-provenance.json -print -quit)")"
            NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            cat > "$NOTES" <<EOF
          ReefVision $VERSION — stable Windows x64 desktop release.

          GitHub Actions exact-head software acceptance: PASS (run $RUN_ID, commit $SOURCE_SHA).
          Installation, packaged SAM on CPU, persistence, and uninstall passed on disposable Windows CI.
          The complete MSI and external cabinet set are verified with SHA-256 and build-provenance.json.

          OWNER-WAIVED: testing on the maintainer's personal Windows/RTX 3090 system and scientific performance validation on a representative coral dataset. These were not passed or performed, and no real-world research accuracy is claimed.

          Launch ReefVision_Windows_Downloader.exe to automatically fetch the latest complete MSI and every required CAB file with digest checks. No pretrained detection weights are included.
          EOF
            gh release create "$TAG" "$ASSET_DIR"/*.msi "$ASSET_DIR"/rv*.cab "$ASSET_DIR"/build-provenance.json "$RUNNER_TEMP/downloader/ReefVision_Windows_Downloader.exe" \
              --repo "$REPO" --target "$SOURCE_SHA" --title "$TITLE" --notes-file "$NOTES" --draft
            test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
            gh release edit "$TAG" --repo "$REPO" --draft=false
            if [[ "$VERSION" == 1.0.2 ]]; then
              gh release edit "$TAG" --repo "$REPO" --latest
            fi
            gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,assets --jq '{tag:.tagName,draft:.isDraft,assets:[.assets[].name]}'
            rm -rf "$STAGE"
          done
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v1.0.2

  verify-download-button:
    name: Verify homepage Windows downloader resolves and checks manifests
    needs: publish-both
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download stable button target, check hash, check latest release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/Rafael-Del-Valle/ReefVision/releases/latest/download/ReefVision_Windows_Downloader.exe'
          $out = Join-Path $env:RUNNER_TEMP 'ReefVision_Windows_Downloader.exe'
          $ok = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $out -MaximumRedirection 10
              $ok = $true
              break
            } catch {
              Write-Host "Retry $attempt/6: $_"
              Start-Sleep -Seconds 15
            }
          }
          if (-not $ok) { throw 'Windows download button failed to resolve' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant()
          if ($hash -ne '31144f04be2ecbdff356efbe3ae873b8fc4c4867d106c14008c0fc37b0c5e8d1') { throw "Unexpected downloader hash: $hash" }
          & $out --check-release --stable
          if ($LASTEXITCODE -ne 0) { throw 'Stable release manifest check failed' }
          & $out --check-release
          if ($LASTEXITCODE -ne 0) { throw 'Default release manifest check failed' }
          Write-Host 'ReefVision latest Windows download button and manifest verified.'