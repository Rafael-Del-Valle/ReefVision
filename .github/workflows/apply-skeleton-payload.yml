name: Apply coral skeleton payload

on:
  pull_request:
    types:
      - synchronize
    paths:
      - ".github/workflows/apply-skeleton-payload.yml"
      - ".skeleton-payload/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-phases-advancement
          fetch-depth: 0

      - name: Verify and extract reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          expected_entries=$(cat <<'EOF'
          apps/api/reefvision/api/routes/measurements.py
          apps/api/reefvision/ml/skeleton_analysis.py
          apps/api/reefvision/schemas/advanced_measurements.py
          apps/api/reefvision/services/advanced_measurements.py
          apps/api/reefvision/tests/test_skeleton_analysis_phase4.py
          apps/web/src/features/measurements/MeasurementsDashboard.tsx
          apps/web/src/features/measurements/SkeletonWorkbench.test.tsx
          apps/web/src/features/measurements/SkeletonWorkbench.tsx
          apps/web/src/features/measurements/skeletonApi.ts
          docs/CORAL_SKELETON_ANALYSIS.md
          EOF
          )
          cat .skeleton-payload/part-* > /tmp/skeleton-payload.b64
          base64 --decode /tmp/skeleton-payload.b64 > /tmp/skeleton-payload.tar.gz
          echo "f84ad1d44b6ce818d1e65ba37e01f40f4fa1370497237ae1597a398e9d605bb3  /tmp/skeleton-payload.tar.gz" | sha256sum --check -
          actual_entries=$(tar -tzf /tmp/skeleton-payload.tar.gz | sort)
          test "$actual_entries" = "$expected_entries"
          tar -xzf /tmp/skeleton-payload.tar.gz
          python -m compileall -q \
            apps/api/reefvision/ml/skeleton_analysis.py \
            apps/api/reefvision/schemas/advanced_measurements.py \
            apps/api/reefvision/services/advanced_measurements.py \
            apps/api/reefvision/api/routes/measurements.py \
            apps/api/reefvision/tests/test_skeleton_analysis_phase4.py
          rm -rf .skeleton-payload
          rm -f .github/workflows/apply-skeleton-payload.yml
          git diff --check

      - name: Commit coral skeleton system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement coral skeleton analysis workbench"
          git push origin HEAD:feat/all-phases-advancement
