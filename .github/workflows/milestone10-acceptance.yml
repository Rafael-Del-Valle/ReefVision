name: Milestone 10 Acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  workflow-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 10 Python
        run: |
          python -m ruff check \
            apps/api/migrations/versions/0024_workflow_execution.py \
            apps/api/reefvision/api/routes/workflow_graphs.py \
            apps/api/reefvision/config.py \
            apps/api/reefvision/db/models/workflow_execution.py \
            apps/api/reefvision/domain/enums.py \
            apps/api/reefvision/jobs/workflow.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/ml/model_bundles.py \
            apps/api/reefvision/ml/sam2_provider.py \
            apps/api/reefvision/schemas/workflow_execution.py \
            apps/api/reefvision/schemas/workflow_graphs.py \
            apps/api/reefvision/services/jobs.py \
            apps/api/reefvision/services/models.py \
            apps/api/reefvision/services/workflow_auto_label.py \
            apps/api/reefvision/services/workflow_consensus.py \
            apps/api/reefvision/services/workflow_execution.py \
            apps/api/reefvision/services/workflow_graphs.py \
            apps/api/reefvision/services/workflow_node_registry.py \
            apps/api/reefvision/services/workflow_prompt_assist.py \
            apps/api/reefvision/services/workflow_review.py \
            apps/api/reefvision/services/workflow_runtime_adapters.py \
            apps/api/reefvision/services/workflow_vlm.py \
            apps/api/reefvision/tests/test_workflow_auto_label_phase10.py \
            apps/api/reefvision/tests/test_workflow_consensus_phase10.py \
            apps/api/reefvision/tests/test_workflow_execution_phase10.py \
            apps/api/reefvision/tests/test_workflow_graphs_phase10.py \
            apps/api/reefvision/tests/test_workflow_prompt_assist_graph_phase10.py \
            apps/api/reefvision/tests/test_workflow_prompt_assist_phase10.py \
            apps/api/reefvision/tests/test_workflow_review_phase10.py \
            apps/api/reefvision/tests/test_workflow_sam2_registration_phase10.py \
            apps/api/reefvision/tests/test_workflow_vlm_graph_phase10.py \
            apps/api/reefvision/tests/test_workflow_vlm_phase10.py
          python -m ruff format --check \
            apps/api/migrations/versions/0024_workflow_execution.py \
            apps/api/reefvision/api/routes/workflow_graphs.py \
            apps/api/reefvision/config.py \
            apps/api/reefvision/db/models/workflow_execution.py \
            apps/api/reefvision/domain/enums.py \
            apps/api/reefvision/jobs/workflow.py \
            apps/api/reefvision/jobs/worker.py \
            apps/api/reefvision/ml/model_bundles.py \
            apps/api/reefvision/ml/sam2_provider.py \
            apps/api/reefvision/schemas/workflow_execution.py \
            apps/api/reefvision/schemas/workflow_graphs.py \
            apps/api/reefvision/services/jobs.py \
            apps/api/reefvision/services/models.py \
            apps/api/reefvision/services/workflow_auto_label.py \
            apps/api/reefvision/services/workflow_consensus.py \
            apps/api/reefvision/services/workflow_execution.py \
            apps/api/reefvision/services/workflow_graphs.py \
            apps/api/reefvision/services/workflow_node_registry.py \
            apps/api/reefvision/services/workflow_prompt_assist.py \
            apps/api/reefvision/services/workflow_review.py \
            apps/api/reefvision/services/workflow_runtime_adapters.py \
            apps/api/reefvision/services/workflow_vlm.py \
            apps/api/reefvision/tests/test_workflow_auto_label_phase10.py \
            apps/api/reefvision/tests/test_workflow_consensus_phase10.py \
            apps/api/reefvision/tests/test_workflow_execution_phase10.py \
            apps/api/reefvision/tests/test_workflow_graphs_phase10.py \
            apps/api/reefvision/tests/test_workflow_prompt_assist_graph_phase10.py \
            apps/api/reefvision/tests/test_workflow_prompt_assist_phase10.py \
            apps/api/reefvision/tests/test_workflow_review_phase10.py \
            apps/api/reefvision/tests/test_workflow_sam2_registration_phase10.py \
            apps/api/reefvision/tests/test_workflow_vlm_graph_phase10.py \
            apps/api/reefvision/tests/test_workflow_vlm_phase10.py
      - name: Run Milestone 10 workflow tests
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_workflow_graphs_phase10.py
          apps/api/reefvision/tests/test_workflow_execution_phase10.py
          apps/api/reefvision/tests/test_workflow_consensus_phase10.py
          apps/api/reefvision/tests/test_workflow_review_phase10.py
          apps/api/reefvision/tests/test_workflow_auto_label_phase10.py
          apps/api/reefvision/tests/test_workflow_prompt_assist_graph_phase10.py
          apps/api/reefvision/tests/test_workflow_prompt_assist_phase10.py
          apps/api/reefvision/tests/test_workflow_sam2_registration_phase10.py
          apps/api/reefvision/tests/test_workflow_vlm_graph_phase10.py
          apps/api/reefvision/tests/test_workflow_vlm_phase10.py
          -q
      - name: Verify 0024 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-m10"
          mkdir -p "$REEFVISION_DATA_ROOT"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0023
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          assert scripts.get_heads() == ['0024'], scripts.get_heads()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check workflow desktop workspace
        working-directory: apps/web
        run: |
          npx prettier --check src/features/workflow-graphs
          npm run typecheck
