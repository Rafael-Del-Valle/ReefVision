name: Fix Runtime Library Array Handling

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/fix-runtime-library-array.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0

      - name: Normalize runtime library collection before Count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-desktop-backend.ps1")
          text = path.read_text(encoding="utf-8")
          old = 'if ($BundledRuntimeLibraries.Count -gt 0) {'
          new = 'if (@($BundledRuntimeLibraries).Count -gt 0) {'
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one runtime-library Count check, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-desktop-backend.ps1
          git rm .github/workflows/fix-runtime-library-array.yml
          git commit -m "Handle a single bundled runtime library"
          git push origin HEAD:fix/model-install-worker
