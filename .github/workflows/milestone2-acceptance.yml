name: Milestone 2 Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/milestone2-acceptance.yml"
      - "apps/api/migrations/**"
      - "apps/api/reefvision/api/routes/annotation_imports.py"
      - "apps/api/reefvision/services/annotation_imports.py"
      - "apps/api/reefvision/services/enhanced_annotation_imports.py"
      - "apps/api/reefvision/services/mask_aware_dataset_versions.py"
      - "apps/api/reefvision/storage/masks.py"
      - "apps/api/reefvision/storage/segmentation_exports.py"
      - "apps/api/reefvision/tests/test_annotation_imports.py"
      - "apps/api/reefvision/tests/test_milestone2_import_acceptance.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  milestone2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 2 Python
        run: |
          python -m ruff check apps/api/reefvision/services/enhanced_annotation_imports.py apps/api/reefvision/api/routes/annotation_imports.py apps/api/reefvision/tests/test_annotation_imports.py apps/api/reefvision/tests/test_milestone2_import_acceptance.py
          python -m ruff format --check apps/api/reefvision/services/enhanced_annotation_imports.py apps/api/reefvision/api/routes/annotation_imports.py apps/api/reefvision/tests/test_annotation_imports.py apps/api/reefvision/tests/test_milestone2_import_acceptance.py
      - name: Run Milestone 2 import and native-workflow tests
        run: python -m pytest apps/api/reefvision/tests/test_annotation_imports.py apps/api/reefvision/tests/test_milestone2_import_acceptance.py
      - name: Verify 0015 and 0016 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/reefvision-milestone2-migrations"
          alembic -c apps/api/alembic.ini upgrade 53ba400993db
          alembic -c apps/api/alembic.ini upgrade 0016
          alembic -c apps/api/alembic.ini downgrade 53ba400993db
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini current
