name: ReefVision 1.0.3 camera and gallery regression

# PR #73 is merged; its isolated branch still needs independently verifiable
# Windows camera-import and Chromium initial-image/gallery acceptance.
on:
  push:
    branches:
      - develop/reefvision-1.0.3-consolidated
    paths:
      - .github/workflows/reefvision-103-camera-gallery-regression.yml
      - apps/api/reefvision/storage/images.py
      - apps/api/reefvision/services/images.py
      - apps/api/reefvision/tests/test_camera_jpeg_regression_103.py
      - apps/api/reefvision/tests/test_image_import_collision_103.py
      - apps/api/reefvision/api/routes/training.py
      - apps/api/reefvision/tests/test_training_log_tail_103.py
      - apps/web/src-tauri/**
      - scripts/test-training-console-readonly.ps1
      - scripts/test-training-console-sanitizer.ps1
      - apps/web/src/features/gallery/**
      - apps/web/src/features/workflow-graphs/**
      - apps/api/reefvision/api/routes/workflow_graphs.py
      - apps/api/reefvision/services/workflow_graphs.py
      - apps/api/reefvision/jobs/workflow.py
      - apps/api/reefvision/tests/test_workflow_graphs_phase10.py
      - apps/api/reefvision/tests/test_workflow_execution_phase10.py
      - apps/web/src/features/annotation-editor/ImageViewport*
      - apps/web/tests/e2e/gallery-viewport-103.spec.ts
      - apps/web/package.json
      - apps/web/package-lock.json
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reefvision-103-camera-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-camera-import:
    name: Windows JPEG aliases, EXIF, and immutable originals
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact source revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA $actual does not match workflow SHA $env:GITHUB_SHA"
          }
          Write-Output "Camera import test source SHA: $actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and scientific test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install opencv-python-headless boto3
      - name: Verify JPEG camera formats and immutable original storage
        shell: pwsh
        env:
          REEFVISION_ENV: test
          REEFVISION_BACKGROUND_WORKER_ENABLED: "false"
        run: |
          python -m pytest apps/api/reefvision/tests/test_camera_jpeg_regression_103.py apps/api/reefvision/tests/test_image_import_collision_103.py -q
      - name: Verify read-only training log tail and symlink security
        shell: pwsh
        env:
          REEFVISION_ENV: test
          REEFVISION_BACKGROUND_WORKER_ENABLED: "false"
        run: |
          python -m pytest apps/api/reefvision/tests/test_training_log_tail_103.py -q
      - name: Verify saved Workflow Builder graphs, immutable revisions, and typed execution
        shell: pwsh
        env:
          REEFVISION_ENV: test
          REEFVISION_BACKGROUND_WORKER_ENABLED: "false"
        run: |
          python -m pytest apps/api/reefvision/tests/test_workflow_graphs_phase10.py apps/api/reefvision/tests/test_workflow_execution_phase10.py -q
      - name: Verify embedded PowerShell monitor reads real losses without controlling jobs
        shell: pwsh
        run: |
          ./scripts/test-training-console-sanitizer.ps1
          ./scripts/test-training-console-readonly.ps1
      - name: Verify Tauri desktop Rust lifecycle and training-run ID safety
        shell: pwsh
        run: |
          # Run the real Rust unit tests on Windows, not just static source
          # assertions. --locked prevents unreviewed dependency resolution.
          cargo --version
          cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting check failed." }

          # Tauri validates every configured resource path even for debug
          # unit tests. Release resources are generated separately by the
          # Windows packaging pipeline and must never be synthesized there.
          # Provide disposable, explicitly non-release placeholders ONLY for
          # this cargo test invocation. build.rs still requires the genuine
          # PyInstaller backend and model catalog when PROFILE=release.
          $resourceDirs = @(
            ".desktop/release-1.0.3/backend",
            ".desktop/release-1.0.3/bundled-models"
          )
          foreach ($dir in $resourceDirs) {
            if (Test-Path -LiteralPath $dir) {
              throw "Unexpected pre-existing staged resource directory: $dir"
            }
          }
          try {
            foreach ($dir in $resourceDirs) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              Set-Content -LiteralPath (Join-Path $dir "CI-DEBUG-ONLY.txt") -Value "Not a release resource. Debug Rust unit tests only."
            }
            cargo test --manifest-path apps/web/src-tauri/Cargo.toml --locked
            if ($LASTEXITCODE -ne 0) { throw "Tauri Rust unit tests failed." }
          }
          finally {
            foreach ($dir in $resourceDirs) {
              if (Test-Path -LiteralPath $dir) {
                Remove-Item -LiteralPath $dir -Recurse -Force
              }
            }
          }

  chromium-initial-image-gallery:
    name: Chromium first image, wheel navigation, and gallery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Gallery test source SHA: $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Validate gallery and image viewport regressions
        working-directory: apps/web
        run: |
          npm run typecheck
          npx vitest run --config vite.config.mjs --configLoader runner src/features/gallery/Gallery.test.tsx src/features/gallery/galleryNavigation.test.ts src/features/annotation-editor/ImageViewport.test.tsx src/features/workflow-graphs/WorkflowGraphWorkspace.test.tsx src/features/workflow-graphs/WorkflowVisualEditor.test.tsx src/features/workflow-graphs/workflowTemplates.test.ts
      - name: Install Chromium for browser-level acceptance
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build and exercise first image and filmstrip in Chromium
        working-directory: apps/web
        run: |
          npm run ui:build
          npx playwright test tests/e2e/gallery-viewport-103.spec.ts --project=chromium
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-103-gallery-browser-failure
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
