name: Run Live Download Progress Patch PR

on:
  pull_request:
    paths:
      - .github/live-download-progress-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source patch
        run: python scripts/patch_live_download_progress.py

      - name: Validate Python syntax
        run: python -m compileall -q apps/api/reefvision/api/routes/jobs.py apps/api/reefvision/tests/test_model_install.py

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/api/client.ts \
            apps/web/src/features/models/ModelManager.tsx \
            apps/web/src/features/models/ModelManager.test.tsx \
            apps/api/reefvision/tests/test_model_install.py
          git commit -m "Make model download progress polling live"
          git push origin HEAD:fix/model-install-worker
