name: Pose Workflow Validation

on:
  pull_request:
    paths:
      - "apps/api/reefvision/**"
      - "apps/web/src/features/pose/**"
      - "apps/web/src/features/video/**"
      - ".github/workflows/pose-workflow-validation.yml"
  workflow_dispatch:

concurrency:
  group: pose-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check apps/api
      - name: Ruff format check
        run: python -m ruff format --check apps/api
      - name: Backend typing
        run: python -m mypy -p reefvision
      - name: Pose pytest
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_video_pose_tracking.py
          apps/api/reefvision/tests/test_video_tracking_phase6.py
          apps/api/reefvision/tests/test_pose_temporal_tracking.py
          -q
      - name: Verify temporal pose migration roundtrip
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-pose-migration"
          mkdir -p "$REEFVISION_DATA_ROOT"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0030
          python -m alembic -c apps/api/alembic.ini upgrade head

  frontend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Prettier check
        working-directory: apps/web
        run: npm run format:check
      - name: TypeScript
        working-directory: apps/web
        run: npm run typecheck
      - name: Pose Vitest
        working-directory: apps/web
        run: >-
          npx vitest run
          src/features/pose/PoseAnnotationEditor.test.tsx
          src/features/video/poseKeyframeAdapter.test.ts
          src/features/video/PoseTemporalReviewPanel.test.tsx
          src/features/video/VideoTrackingWorkspace.test.tsx
          --config vite.config.mjs
          --configLoader runner
      - name: Frontend build
        working-directory: apps/web
        run: npm run build
