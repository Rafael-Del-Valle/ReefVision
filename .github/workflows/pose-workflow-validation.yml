name: Pose Workflow Validation

on:
  pull_request:
    paths:
      - "apps/api/reefvision/**"
      - "apps/api/migrations/**"
      - "apps/api/alembic.ini"
      - "apps/web/src/features/pose/**"
      - "apps/web/src/features/video/**"
      - ".github/workflows/pose-workflow-validation.yml"
  workflow_dispatch:

concurrency:
  group: pose-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check apps/api
      - name: Ruff format check
        run: python -m ruff format --check apps/api
      - name: Backend typing
        run: python -m mypy -p reefvision
      - name: Pose pytest
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_video_pose_tracking.py
          apps/api/reefvision/tests/test_video_tracking_phase6.py
          apps/api/reefvision/tests/test_pose_temporal_tracking.py
          apps/api/reefvision/tests/test_pose_schema_revisions.py
          -q
      - name: Verify temporal pose migration roundtrip
        run: |
          export REEFVISION_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/reefvision-pose-migration.XXXXXX")"
          # Pin the scratch database explicitly; never use an inherited application DB URL.
          export REEFVISION_DATABASE_URL="sqlite:///$REEFVISION_DATA_DIR/reefvision.db"
          export MIGRATION_EVIDENCE="$REEFVISION_DATA_DIR/migration-evidence.jsonl"
          echo "MIGRATION_EVIDENCE=$MIGRATION_EVIDENCE" >> "$GITHUB_ENV"
          export MIGRATION_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          verify_revision() {
            python - "$1" "$2" <<'PY'
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          from alembic.config import Config
          from alembic.script import ScriptDirectory

          stage, expected = sys.argv[1:3]
          if expected == "head":
              expected = ScriptDirectory.from_config(
                  Config("apps/api/alembic.ini")
              ).get_current_head()
              assert expected is not None, "Migration graph has no head"
          database = Path(os.environ["REEFVISION_DATA_DIR"]) / "reefvision.db"
          with sqlite3.connect(database.as_uri() + "?mode=ro", uri=True) as conn:
              revisions = conn.execute("SELECT version_num FROM alembic_version").fetchall()
              integrity = conn.execute("PRAGMA quick_check").fetchall()
              foreign_keys = conn.execute("PRAGMA foreign_key_check").fetchall()
          assert revisions == [(expected,)], (expected, revisions)
          assert integrity == [("ok",)], integrity
          assert not foreign_keys, foreign_keys
          evidence = {
              "stage": stage,
              "checkout_sha": os.environ["GITHUB_SHA"],
              "source_sha": os.environ["MIGRATION_SOURCE_SHA"],
              "expected_revision": expected,
              "actual_revision": revisions[0][0],
              "quick_check": integrity[0][0],
              "foreign_key_violations": len(foreign_keys),
          }
          with Path(os.environ["MIGRATION_EVIDENCE"]).open("a", encoding="utf-8") as report:
              report.write(json.dumps(evidence, sort_keys=True) + "\n")
          print(f"Verified revision {expected}; quick_check=ok; foreign_key_check=ok")
          PY
          }
          python -m alembic -c apps/api/alembic.ini upgrade head
          verify_revision initial_upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0030
          verify_revision downgrade 0030
          python -m alembic -c apps/api/alembic.ini upgrade head
          verify_revision final_upgrade head
      - name: Retain scratch migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: pose-migration-evidence-${{ github.run_attempt }}
          path: ${{ env.MIGRATION_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7

  frontend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Prettier check
        working-directory: apps/web
        run: npm run format:check
      - name: TypeScript
        working-directory: apps/web
        run: npm run typecheck
      - name: Pose Vitest
        working-directory: apps/web
        run: >-
          npx vitest run
          src/features/pose/PoseAnnotationEditor.test.tsx
          src/features/video/poseKeyframeAdapter.test.ts
          src/features/video/PoseTemporalReviewPanel.test.tsx
          src/features/video/VideoTrackingWorkspace.test.tsx
          --config vite.config.mjs
          --configLoader runner
      - name: Frontend build
        working-directory: apps/web
        run: npm run build
