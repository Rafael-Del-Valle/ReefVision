name: Pose Workflow Validation

on:
  pull_request:
    paths:
      - "apps/api/reefvision/**"
      - "apps/web/src/features/pose/**"
      - "apps/web/src/features/video/**"
      - ".github/workflows/pose-workflow-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install ruff
      - run: npm ci
        working-directory: apps/web
      - name: Format affected Python files
        run: >-
          python -m ruff format
          apps/api/reefvision/api/routes/videos.py
          apps/api/reefvision/jobs/video_annotated_export.py
          apps/api/reefvision/jobs/video_tracking.py
          apps/api/reefvision/schemas/models.py
          apps/api/reefvision/services/semantic_models.py
          apps/api/reefvision/tests/test_video_pose_tracking.py
          apps/api/reefvision/tests/test_video_tracking_phase6.py
      - name: Format affected frontend files
        working-directory: apps/web
        run: >-
          npx prettier --write
          src/features/pose/PoseAnnotationEditor.test.tsx
          src/features/pose/PoseAnnotationEditor.tsx
          src/features/video/poseKeyframeAdapter.test.ts
          src/features/video/poseKeyframeAdapter.ts
          src/features/video/VideoTrackingWorkspace.test.tsx
          src/features/video/VideoTrackingWorkspace.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/api/reefvision/api/routes/videos.py             apps/api/reefvision/jobs/video_annotated_export.py             apps/api/reefvision/jobs/video_tracking.py             apps/api/reefvision/schemas/models.py             apps/api/reefvision/services/semantic_models.py             apps/api/reefvision/tests/test_video_pose_tracking.py             apps/api/reefvision/tests/test_video_tracking_phase6.py             apps/web/src/features/pose/PoseAnnotationEditor.test.tsx             apps/web/src/features/pose/PoseAnnotationEditor.tsx             apps/web/src/features/video/poseKeyframeAdapter.test.ts             apps/web/src/features/video/poseKeyframeAdapter.ts             apps/web/src/features/video/VideoTrackingWorkspace.test.tsx             apps/web/src/features/video/VideoTrackingWorkspace.tsx
          git commit -m "Format pose workflow files"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

  backend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff check
        continue-on-error: true
        run: python -m ruff check apps/api
      - name: Ruff format check
        continue-on-error: true
        run: python -m ruff format --check apps/api
      - name: Backend typing
        continue-on-error: true
        run: python -m mypy -p reefvision
      - name: Pose pytest
        continue-on-error: true
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_video_pose_tracking.py
          apps/api/reefvision/tests/test_video_tracking_phase6.py
          -q

  frontend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Prettier check
        continue-on-error: true
        working-directory: apps/web
        run: npm run format:check
      - name: TypeScript
        continue-on-error: true
        working-directory: apps/web
        run: npm run typecheck
      - name: Pose Vitest
        continue-on-error: true
        working-directory: apps/web
        run: >-
          npx vitest run
          src/features/pose/PoseAnnotationEditor.test.tsx
          src/features/video/poseKeyframeAdapter.test.ts
          src/features/video/VideoTrackingWorkspace.test.tsx
          --config vite.config.mjs
          --configLoader runner
      - name: Frontend build
        continue-on-error: true
        working-directory: apps/web
        run: npm run build
