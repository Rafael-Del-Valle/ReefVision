name: Pose Workflow Validation

on:
  pull_request:
    paths:
      - "apps/api/reefvision/**"
      - "apps/web/src/features/pose/**"
      - "apps/web/src/features/video/**"
      - ".github/workflows/pose-workflow-validation.yml"
  workflow_dispatch:

jobs:
  backend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff check
        continue-on-error: true
        run: python -m ruff check apps/api
      - name: Ruff format check
        continue-on-error: true
        run: python -m ruff format --check apps/api
      - name: Backend typing
        continue-on-error: true
        run: python -m mypy -p reefvision
      - name: Pose pytest
        continue-on-error: true
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_video_pose_tracking.py
          apps/api/reefvision/tests/test_video_tracking_phase6.py
          -q

  frontend-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Prettier check
        continue-on-error: true
        working-directory: apps/web
        run: npm run format:check
      - name: TypeScript
        continue-on-error: true
        working-directory: apps/web
        run: npm run typecheck
      - name: Pose Vitest
        continue-on-error: true
        working-directory: apps/web
        run: >-
          npx vitest run
          src/features/pose/PoseAnnotationEditor.test.tsx
          src/features/video/poseKeyframeAdapter.test.ts
          src/features/video/VideoTrackingWorkspace.test.tsx
          --config vite.config.mjs
          --configLoader runner
      - name: Frontend build
        continue-on-error: true
        working-directory: apps/web
        run: npm run build
