name: ReefVision 1.0.3 read-only training console regression

# PR #73 has already merged, but its isolated development branch still
# contains release-blocker fixes. Validate new commits on that exact branch.
on:
  push:
    branches:
      - develop/reefvision-1.0.3-consolidated
    paths:
      - .github/workflows/reefvision-103-console-regression.yml
      - apps/web/src-tauri/src/main.rs
      # A sanitized backend tail feeds this embedded external observer.
      # Exercise the Windows consumer whenever its source changes.
      - apps/api/reefvision/api/routes/training.py
      - apps/api/reefvision/tests/test_training_log_tail_103.py
      - scripts/test-training-console-readonly.ps1
      - scripts/test-training-console-sanitizer.ps1
      # The desktop UI is the only intended launch surface. Changes here must
      # rerun Windows-specific launcher and loss-display regressions too.
      - apps/web/src/runtime.ts
      - apps/web/src/runtime.test.ts
      - apps/web/src/components/layout/ProjectTrainingMonitor.tsx
      - apps/web/src/components/layout/ProjectTrainingMonitor.test.tsx
      - apps/web/package.json
      - apps/web/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

# Windows console tests are an independent 1.0.3 release gate. Preserve
# in-progress exact-SHA runs when another development commit is pushed;
# GitHub may still replace a pending run while a previous run executes.
concurrency:
  group: reefvision-103-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-readonly-console:
    name: Windows embedded monitor, loss history, and terminal safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert the exact source revision under test
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA $actual does not match workflow SHA $env:GITHUB_SHA"
          }
          Write-Output "ReefVision 1.0.3 training console source SHA: $actual"
      - name: Verify terminal sanitization of untrusted training output
        shell: pwsh
        run: ./scripts/test-training-console-sanitizer.ps1
      - name: Verify read-only polling, live box/cls/dfl losses, and terminal states
        shell: pwsh
        run: ./scripts/test-training-console-readonly.ps1

  windows-desktop-launcher:
    name: Windows desktop console launcher and scientific loss UI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert the exact source revision under test
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout SHA $actual does not match workflow SHA $env:GITHUB_SHA"
          }
          Write-Output "ReefVision 1.0.3 desktop launcher source SHA: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/web
        shell: pwsh
        run: npm ci
      - name: Verify typed launcher and read-only training monitor on Windows
        working-directory: apps/web
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck failed.' }
          npx vitest run --config vite.config.mjs --configLoader runner src/runtime.test.ts src/components/layout/ProjectTrainingMonitor.test.tsx
          if ($LASTEXITCODE -ne 0) { throw 'Desktop training monitor regressions failed.' }
