name: Build Windows Desktop Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [develop/reefvision-1.2]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/**"
      - "requirements/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Fast safety checks run before bootstrap / the multi-GB MSI build.
      - name: Validate Windows clean-install harness safeguards
        shell: pwsh
        run: |
          ./scripts/test-windows-clean-install-harness.ps1
          ./scripts/test-windows-installer-payload.ps1
          ./scripts/test-training-console-sanitizer.ps1
          ./scripts/test-training-console-readonly.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Windows installer version before packaging
        run: python scripts/check-windows-installer-acceptance-version.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Bootstrap build environment
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -NonInteractive -SkipPlaywrightBrowser

      - name: Stage pinned Video Depth Anything source for packaging
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/install-video-depth-anything-source.py

      - name: Run focused backend tests
        shell: pwsh
        run: >-
          ./.venv/Scripts/python.exe -m pytest
          apps/api/reefvision/tests/test_desktop_runtime.py
          apps/api/reefvision/tests/test_model_install.py
          apps/api/reefvision/tests/test_bundled_models.py

      - name: Verify Rust desktop tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .desktop/release-1.6.0/backend, .desktop/release-1.6.0/bundled-models | Out-Null
          npm --prefix apps/web run ui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/web/src-tauri/Cargo.toml

      - name: Build weight-free 1.6.0 desktop installer
        shell: pwsh
        run: |
          $LogPath = Join-Path $PWD ".desktop\windows-installer-build.log"
          New-Item -ItemType Directory -Path (Split-Path -Parent $LogPath) -Force | Out-Null
          npm run build:desktop *> $LogPath
          $ExitCode = $LASTEXITCODE
          if ($ExitCode -ne 0) {
            Write-Host "Desktop build failed. Final diagnostic output:" -ForegroundColor Red
            Get-Content -LiteralPath $LogPath -Tail 250
            exit $ExitCode
          }
          Get-Content -LiteralPath $LogPath -Tail 60

      # Retain the complete packaging log for installer-size and resource audits.
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-Windows-Build-Log
          path: .desktop/windows-installer-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      # Bound each upload below 2 GiB and publish every MSI-declared cabinet.
      - name: Partition verified installer for artifact transport
        id: payload
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $folder = 'apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi'
          $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $parts = [System.Collections.Generic.List[object]]::new()
          $parts.Add([System.Collections.Generic.List[string]]::new())
          $parts[0].Add((Join-Path $folder 'build-provenance.json'))
          [long]$partBytes = (Get-Item -LiteralPath $parts[0][0]).Length
          foreach ($entry in $payload.files) {
            if ($entry.size_bytes -ge 2GB) { throw "Artifact file exceeds transport limit: $($entry.name)" }
            if ($partBytes + $entry.size_bytes -ge 2GB) {
              $parts.Add([System.Collections.Generic.List[string]]::new())
              $partBytes = 0
            }
            $parts[$parts.Count - 1].Add((Join-Path $folder $entry.name))
            $partBytes += $entry.size_bytes
          }
          if ($parts.Count -gt 4) { throw 'Installer needs more than four artifact parts.' }
          for ($i = 0; $i -lt $parts.Count; $i++) {
            "part$($i + 1)<<EOF" >> $env:GITHUB_OUTPUT
            $parts[$i] | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
            'EOF' >> $env:GITHUB_OUTPUT
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-RC-Installer-Part-1
          path: ${{ steps.payload.outputs.part1 }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.part2 != ''
        with:
          name: ReefVision-1.6.0-RC-Installer-Part-2
          path: ${{ steps.payload.outputs.part2 }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.part3 != ''
        with:
          name: ReefVision-1.6.0-RC-Installer-Part-3
          path: ${{ steps.payload.outputs.part3 }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.part4 != ''
        with:
          name: ReefVision-1.6.0-RC-Installer-Part-4
          path: ${{ steps.payload.outputs.part4 }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-clean-install-acceptance:
    name: Fresh install, launch, persist and uninstall 1.6.0 on disposable Windows
    # The native CDP endpoint is verified on this hosted Windows image.
    runs-on: windows-2022
    needs: build-windows-installer
    timeout-minutes: 75
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Retrieve exact MSI and every external CAB
        uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-1-6-0-installer

      - name: Verify version, source, MSI Media and payload digests
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $payload | ConvertTo-Json -Depth 8

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the Playwright driver for the installed WebView2
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Test isolated MSI installation without developer runtimes on PATH
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $msi = Join-Path $folder 'ReefVision_1.6.0_x64_en-US.msi'
          . ./scripts/lib/node-tools.ps1
          $playwrightNode = Find-ReefVisionExecutable -Names 'node.exe'
          if (-not $playwrightNode) { throw 'Packaged WebView2 acceptance requires Node from setup-node.' }
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              throw "Unexpected developer runtime on isolated PATH: $cmd"
            }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -ExpectedVersion '1.6.0' -ExpectedSchemaRevision 'b16_integrated_0001' `
            -AcceptanceRoot 'C:\reefvision-1-6-0-disposable-acceptance' `
            -SpatialWorkflowNodePath $playwrightNode -HostedStandardUserWebView2 -FirstUseAcceptance -ResearchWorkflowAcceptance -WorkspaceWorkflowAcceptance `
            -SkipUpgrade -DisposableTest -KeepArtifacts

      - name: Upload isolated Windows acceptance report and MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-RC-Windows-Clean-Install-Evidence
          path: |
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
            .artifacts/windows-clean-acceptance-*/spatial-playwright.json
            .artifacts/windows-clean-acceptance-*/spatial-playwright/**
            .artifacts/windows-clean-acceptance-*/first-use-playwright.json
            .artifacts/windows-clean-acceptance-*/first-use-playwright/**/*-evidence.json
            .artifacts/windows-clean-acceptance-*/workspace-evidence.json
            .artifacts/windows-clean-acceptance-*/workspace-playwright.json
            .artifacts/windows-clean-acceptance-*/research-evidence.json
            .artifacts/windows-clean-acceptance-*/research-playwright.json
            .artifacts/windows-clean-acceptance-*/research-playwright/**/*-evidence.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  windows-qc-history-acceptance:
    name: Windows historical science and QC migration, backup, and rollback
    runs-on: windows-2022
    needs: build-windows-installer
    timeout-minutes: 55
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REEFVISION_1_5_RUN: "44748544977"
      REEFVISION_1_5_SOURCE: b846f57e916ef53abc9a2d25ece9927eb9dfb582
      REEFVISION_1_5_PROVENANCE_SHA256: 152d0f93c35b2bcd9440e569a5d2afba4bd00849935a7c4c3961c83c43e49bbb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-qc-history/candidate

      - name: Verify and extract both original Windows MSI payloads
        shell: pwsh
        run: |
          $evidence = New-Item -ItemType Directory -Path '.artifacts/windows-qc-history'
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'reefvision-qc-history'
          $previous = New-Item -ItemType Directory -Path (Join-Path $payloadRoot 'previous')
          $run = gh run view $env:REEFVISION_1_5_RUN --repo Rafael-Del-Valle/ReefVision --json headSha,conclusion,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.headSha -cne $env:REEFVISION_1_5_SOURCE -or $run.conclusion -ne 'success') {
            throw 'The retained 1.5 installer does not identify the validated successful source.'
          }
          foreach ($part in 1..2) {
            gh run download $env:REEFVISION_1_5_RUN --repo Rafael-Del-Valle/ReefVision --name "ReefVision-1.5.0-RC-Installer-Part-$part" --dir $previous.FullName
            if ($LASTEXITCODE -ne 0) { throw "Validated 1.5 installer part $part is unavailable." }
          }
          $previousDigest = (Get-FileHash -LiteralPath (Join-Path $previous.FullName 'build-provenance.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($previousDigest -cne $env:REEFVISION_1_5_PROVENANCE_SHA256) { throw 'Validated 1.5 installer provenance differs from its pinned digest.' }
          $root = "C:\rvq-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'The isolated historical QC run directory already exists.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $payloads = [ordered]@{ previous_run = $run.url }
          foreach ($role in @('candidate', 'previous')) {
            $version = if ($role -eq 'candidate') { '1.6.0' } else { '1.5.0' }
            $source = if ($role -eq 'candidate') { $env:SOURCE_COMMIT } else { $env:REEFVISION_1_5_SOURCE }
            $folder = Join-Path $payloadRoot $role
            $filename = "ReefVision_${version}_x64_en-US.msi"
            $msi = Join-Path $folder $filename
            $destination = Join-Path $root $role
            $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version $version -ExpectedFilename $filename -SourceCommit $source -RequireProvenance
            $log = Join-Path $evidence.FullName "$role-extraction.log"
            $argsMsi = @('/a', ('"{0}"' -f $msi), ('TARGETDIR="{0}"' -f $destination), '/qn', '/norestart', '/L*v', ('"{0}"' -f $log))
            $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $argsMsi -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "$role administrative extraction failed ($($process.ExitCode))." }
            $sidecar = Join-Path $destination 'PFiles\ReefVision\backend\reefvision-api\reefvision-api.exe'
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "$role verified payload did not extract the expected sidecar." }
            $payloads[$role] = [ordered]@{
              source_commit = $source
              installer_sha256 = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
              provenance_sha256 = (Get-FileHash -LiteralPath (Join-Path $folder 'build-provenance.json') -Algorithm SHA256).Hash.ToLowerInvariant()
              extracted_sidecar_sha256 = (Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash.ToLowerInvariant()
              identity = $payload.identity
              media = $payload.media
              files = $payload.files
            }
          }
          $payloads | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'qc-history-payloads.json')
          "REEFVISION_QC_HISTORY_ROOT=$root" >> $env:GITHUB_ENV

      - name: Generate five populated controls using the original source APIs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the source dependencies used by historical fixture generation.' }
          python scripts/create_windows_qc_history_controls.py (Join-Path $env:REEFVISION_QC_HISTORY_ROOT 'data') 2>&1 |
            Tee-Object -FilePath '.artifacts/windows-qc-history/fixture-sources.log'
          if ($LASTEXITCODE -ne 0) { throw 'Historical source fixture generation failed.' }

      - name: Verify packaged upgrade and recovery for both 0038 histories and QC through 0041
        shell: pwsh
        run: |
          $root = $env:REEFVISION_QC_HISTORY_ROOT
          $sidecar = 'PFiles\ReefVision\backend\reefvision-api\reefvision-api.exe'
          python scripts/acceptance_windows_qc_history.py (Join-Path $root 'data') (Join-Path $root "candidate\$sidecar") (Join-Path $root "previous\$sidecar") '.artifacts/windows-qc-history'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged historical lineage or backup acceptance failed.' }

      - name: Retain historical lineage receipts and sanitized logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-Windows-Historical-QC-Acceptance
          path: |
            .artifacts/windows-qc-history/*.json
            .artifacts/windows-qc-history/*.log
          if-no-files-found: warn
          retention-days: 14

  windows-upgrade-acceptance:
    name: Upgrade 1.0.3 to 1.6.0 and preserve the project on disposable Windows
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-1-6-0-installer

      - name: Verify candidate and published 1.0.3 upgrade baseline
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $null = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $previous = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-3-installer'
          New-Item -ItemType Directory -Path $previous -Force | Out-Null
          gh release download v1.0.3 --repo Rafael-Del-Valle/ReefVision --pattern build-provenance.json --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published 1.0.3 manifest.' }
          $manifestPath = Join-Path $previous 'build-provenance.json'
          $digest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
          if ($digest -ine 'fc5dfd8ce3fd8e4d1ea9d3040d139aff1304c472b42d671262ef0077c119505d') {
            throw 'Published 1.0.3 manifest does not match the pinned SHA-256.'
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne '1.0.3' -or $manifest.source_commit -ne 'e94dad6a3bece7b776bf45776bc5d06cfbc2c0dc' -or
              $manifest.source_tree_clean -ne $true -or $manifest.msi_verified -ne $true) {
            throw 'Published manifest does not identify the audited 1.0.3 release.'
          }
          gh release download v1.0.3 --repo Rafael-Del-Valle/ReefVision --pattern 'ReefVision_1.0.3_x64_en-US.msi' --pattern 'rv*.cab' --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published 1.0.3 upgrade baseline.' }
          $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $previous -Version '1.0.3' -ExpectedFilename 'ReefVision_1.0.3_x64_en-US.msi'
          $expected = @($manifest.files | ForEach-Object { "$($_.name) $($_.sha256)" } | Sort-Object)
          $actual = @($payload.files | ForEach-Object { "$($_.name) $($_.sha256)" } | Sort-Object)
          if (Compare-Object $expected $actual) { throw 'Published 1.0.3 package digests differ from its manifest.' }

      - name: Exercise previous-release upgrade without developer runtimes on PATH
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer\ReefVision_1.6.0_x64_en-US.msi'
          $previousMsi = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-3-installer\ReefVision_1.0.3_x64_en-US.msi'
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -PreviousInstallerPath $previousMsi -PreviousInstallerSupportsIsolatedAcceptance `
            -ExpectedVersion '1.6.0' -ExpectedSchemaRevision 'b16_integrated_0001' `
            -AcceptanceRoot 'C:\reefvision-1-6-0-upgrade-acceptance' `
            -DisposableTest -KeepArtifacts

      - name: Upload isolated Windows upgrade report and MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-RC-Windows-Upgrade-Evidence
          path: |
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  windows-validated-14-upgrade-acceptance:
    name: Upgrade validated 1.4.0 to 1.6.0 and preserve the project on disposable Windows
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REEFVISION_1_4_RUN: "44697377337"
      REEFVISION_1_4_SOURCE: fb2276c87e1c17393200984d804f54b6c0f21dbf
      REEFVISION_1_4_PROVENANCE_SHA256: 86a17ecd0f6a84e9f4811795210b0ea3389b88eab02a2e87d0d1a7f735a819d0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-1-6-0-installer

      - name: Verify both exact MSI payloads and their cabinet digests
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $candidate = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $runJson = gh run view $env:REEFVISION_1_4_RUN --repo Rafael-Del-Valle/ReefVision --json headSha,conclusion,url
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the retained 1.4 installer run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.headSha -cne $env:REEFVISION_1_4_SOURCE -or $run.conclusion -ne 'success') {
            throw 'Retained 1.4 installer run does not match the validated source and conclusion.'
          }
          $previous = Join-Path $env:RUNNER_TEMP 'reefvision-1-4-0-installer'
          New-Item -ItemType Directory -Path $previous | Out-Null
          foreach ($part in 1..2) {
            gh run download $env:REEFVISION_1_4_RUN --repo Rafael-Del-Valle/ReefVision --name "ReefVision-1.4.0-RC-Installer-Part-$part" --dir $previous
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the validated 1.4 installer part $part." }
          }
          $manifestPath = Join-Path $previous 'build-provenance.json'
          $digest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:REEFVISION_1_4_PROVENANCE_SHA256) { throw 'Retained 1.4 provenance differs from the pinned digest.' }
          $baseline = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $previous -Version '1.4.0' -ExpectedFilename 'ReefVision_1.4.0_x64_en-US.msi' -SourceCommit $env:REEFVISION_1_4_SOURCE -RequireProvenance
          if (@($baseline.media | Where-Object { $_.cabinet -and -not $_.embedded }).Count -ne 6) {
            throw 'Validated 1.4.0 payload must contain all six external cabinets.'
          }
          New-Item -ItemType Directory -Path '.artifacts' -Force | Out-Null
          [ordered]@{
            baseline_run_id = [long]$env:REEFVISION_1_4_RUN
            baseline_run_url = $run.url
            baseline_source_commit = $env:REEFVISION_1_4_SOURCE
            baseline_provenance_sha256 = $digest
            baseline = $baseline
            candidate_source_commit = $env:SOURCE_COMMIT
            candidate = $candidate
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath '.artifacts/windows-validated-14-upgrade-payload.json'

      - name: Exercise the validated 1.4 to 1.6 upgrade without developer runtimes on PATH
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer\ReefVision_1.6.0_x64_en-US.msi'
          $previousMsi = Join-Path $env:RUNNER_TEMP 'reefvision-1-4-0-installer\ReefVision_1.4.0_x64_en-US.msi'
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) { throw "Unexpected developer runtime on isolated PATH: $cmd" }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -PreviousInstallerPath $previousMsi -PreviousInstallerSupportsIsolatedAcceptance `
            -ExpectedVersion '1.6.0' -ExpectedSchemaRevision 'b16_integrated_0001' `
            -ExpectedInitialSchemaRevision 'b14_condition_0041' `
            -AcceptanceRoot 'C:\reefvision-1-6-0-upgrade-validated-1-4' `
            -DisposableTest -KeepArtifacts

      - name: Upload isolated validated upgrade report, installer digests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-RC-Windows-Validated-1.4.0-Upgrade-Evidence
          path: |
            .artifacts/windows-validated-14-upgrade-payload.json
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  windows-validated-15-upgrade-acceptance:
    name: Upgrade validated 1.5.0 to 1.6.0 and preserve the project on disposable Windows
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REEFVISION_1_5_RUN: "44748544977"
      REEFVISION_1_5_SOURCE: b846f57e916ef53abc9a2d25ece9927eb9dfb582
      REEFVISION_1_5_PROVENANCE_SHA256: 152d0f93c35b2bcd9440e569a5d2afba4bd00849935a7c4c3961c83c43e49bbb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-1-6-0-installer

      - name: Verify both exact MSI payloads and their cabinet digests
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $candidate = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $runJson = gh run view $env:REEFVISION_1_5_RUN --repo Rafael-Del-Valle/ReefVision --json headSha,conclusion,url
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the retained 1.5 installer run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.headSha -cne $env:REEFVISION_1_5_SOURCE -or $run.conclusion -ne 'success') {
            throw 'Retained 1.5 installer run does not match the validated source and conclusion.'
          }
          $previous = Join-Path $env:RUNNER_TEMP 'reefvision-1-5-0-installer'
          New-Item -ItemType Directory -Path $previous | Out-Null
          foreach ($part in 1..2) {
            gh run download $env:REEFVISION_1_5_RUN --repo Rafael-Del-Valle/ReefVision --name "ReefVision-1.5.0-RC-Installer-Part-$part" --dir $previous
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the validated 1.5 installer part $part." }
          }
          $manifestPath = Join-Path $previous 'build-provenance.json'
          $digest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:REEFVISION_1_5_PROVENANCE_SHA256) { throw 'Retained 1.5 provenance differs from the pinned digest.' }
          $baseline = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $previous -Version '1.5.0' -ExpectedFilename 'ReefVision_1.5.0_x64_en-US.msi' -SourceCommit $env:REEFVISION_1_5_SOURCE -RequireProvenance
          if (@($baseline.media | Where-Object { $_.cabinet -and -not $_.embedded }).Count -ne 5) {
            throw 'Validated 1.5.0 payload must contain all five external cabinets.'
          }
          New-Item -ItemType Directory -Path '.artifacts' -Force | Out-Null
          [ordered]@{
            baseline_run_id = [long]$env:REEFVISION_1_5_RUN
            baseline_run_url = $run.url
            baseline_source_commit = $env:REEFVISION_1_5_SOURCE
            baseline_provenance_sha256 = $digest
            baseline = $baseline
            candidate_source_commit = $env:SOURCE_COMMIT
            candidate = $candidate
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath '.artifacts/windows-validated-15-upgrade-payload.json'

      - name: Exercise the validated 1.5 to 1.6 upgrade without developer runtimes on PATH
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer\ReefVision_1.6.0_x64_en-US.msi'
          $previousMsi = Join-Path $env:RUNNER_TEMP 'reefvision-1-5-0-installer\ReefVision_1.5.0_x64_en-US.msi'
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) { throw "Unexpected developer runtime on isolated PATH: $cmd" }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -PreviousInstallerPath $previousMsi -PreviousInstallerSupportsIsolatedAcceptance -VerifyPreviousInstallerRejectsUpgradedProfile `
            -ExpectedVersion '1.6.0' -ExpectedSchemaRevision 'b16_integrated_0001' `
            -ExpectedInitialSchemaRevision 'b15_integrated_0002' `
            -AcceptanceRoot 'C:\reefvision-1-6-0-upgrade-validated-1-5' `
            -DisposableTest -KeepArtifacts

      - name: Upload isolated validated upgrade report, installer digests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-RC-Windows-Validated-1.5.0-Upgrade-Evidence
          path: |
            .artifacts/windows-validated-15-upgrade-payload.json
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  windows-lineage-acceptance:
    name: Installed 1.6 lineage — ${{ matrix.profile }}
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: validated-1.3
            initial_revision: b13_temporal_0001
            previous_installer: true
            acceptance_slug: validated-1-3
          - profile: draft-1.4-0038
            initial_revision: "0038"
            previous_installer: false
            acceptance_slug: draft-1-4-0038
          - profile: draft-1.4-0039
            initial_revision: "0039"
            previous_installer: false
            acceptance_slug: draft-1-4-0039
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REEFVISION_1_3_RUN: "43767076956"
      REEFVISION_1_3_SOURCE: f44053a90286ce57cc6f7356be922bcf8ba41e22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve exact 1.5 MSI and every external CAB
        uses: actions/download-artifact@v4
        with:
          pattern: ReefVision-1.6.0-RC-Installer-Part-*
          merge-multiple: true
          path: ${{ runner.temp }}/reefvision-1-6-0-installer

      - name: Verify exact-head candidate payload
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer'
          $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $folder -Version '1.6.0' -ExpectedFilename 'ReefVision_1.6.0_x64_en-US.msi' -SourceCommit $env:SOURCE_COMMIT -RequireProvenance
          $payload | ConvertTo-Json -Depth 8

      - name: Generate and independently verify deterministic lineage fixture
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the source package used only to generate lineage fixtures.' }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'reefvision-lineage-fixtures'
          python scripts/create_windows_lineage_fixtures.py $fixtureRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate deterministic lineage fixtures.' }
          $manifest = Join-Path $fixtureRoot 'manifest.json'
          $verification = python scripts/verify_windows_lineage_fixture.py $manifest --profile '${{ matrix.profile }}'
          if ($LASTEXITCODE -ne 0) { throw 'Independent lineage verification failed.' }
          $verification | Set-Content -LiteralPath (Join-Path $fixtureRoot '${{ matrix.profile }}-verification.json') -Encoding utf8

      - name: Retrieve and verify retained exact-SHA 1.3 installer
        if: matrix.previous_installer
        shell: pwsh
        run: |
          $run = gh run view $env:REEFVISION_1_3_RUN --repo Rafael-Del-Valle/ReefVision --json headSha,conclusion | ConvertFrom-Json
          if ($run.headSha -cne $env:REEFVISION_1_3_SOURCE -or $run.conclusion -ne 'success') {
            throw 'Retained 1.3 installer run does not identify the pinned successful source SHA.'
          }
          $previous = Join-Path $env:RUNNER_TEMP 'reefvision-1-3-0-installer'
          New-Item -ItemType Directory -Path $previous | Out-Null
          gh run download $env:REEFVISION_1_3_RUN --repo Rafael-Del-Valle/ReefVision --name ReefVision-1.3.0-RC-Installer-Part-1 --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download retained 1.3 installer part 1.' }
          gh run download $env:REEFVISION_1_3_RUN --repo Rafael-Del-Valle/ReefVision --name ReefVision-1.3.0-RC-Installer-Part-2 --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download retained 1.3 installer part 2.' }
          $payload = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $previous -Version '1.3.0' -ExpectedFilename 'ReefVision_1.3.0_x64_en-US.msi' -SourceCommit $env:REEFVISION_1_3_SOURCE -RequireProvenance
          $payload | ConvertTo-Json -Depth 8

      - name: Exercise installed historical profile, exchange, restore and compatibility
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'reefvision-1-6-0-installer\ReefVision_1.6.0_x64_en-US.msi'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'reefvision-lineage-fixtures'
          $arguments = @{
            InstallerPath = $candidate
            ExpectedVersion = '1.6.0'
            ExpectedSchemaRevision = 'b16_integrated_0001'
            ExpectedInitialSchemaRevision = '${{ matrix.initial_revision }}'
            AcceptanceRoot = 'C:\reefvision-lineage-${{ matrix.acceptance_slug }}'
            LineageManifestPath = (Join-Path $fixtureRoot 'manifest.json')
            LineageProfile = '${{ matrix.profile }}'
            LineageVerificationPath = (Join-Path $fixtureRoot '${{ matrix.profile }}-verification.json')
            DisposableTest = $true
            KeepArtifacts = $true
          }
          if ('${{ matrix.previous_installer }}' -eq 'true') {
            $arguments.PreviousInstallerPath = Join-Path $env:RUNNER_TEMP 'reefvision-1-3-0-installer\ReefVision_1.3.0_x64_en-US.msi'
            $arguments.PreviousInstallerSupportsIsolatedAcceptance = $true
            $arguments.VerifyPreviousInstallerRejectsUpgradedProfile = $true
          } else {
            $arguments.SkipUpgrade = $true
          }
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              throw "Unexpected developer runtime on isolated PATH: $cmd"
            }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 @arguments

      - name: Upload installed lineage report, logs and fixture verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.6.0-Lineage-${{ matrix.profile }}-Evidence
          path: |
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
            .artifacts/windows-clean-acceptance-*/*.reefvision.zip
            ${{ runner.temp }}/reefvision-lineage-fixtures/manifest.json
            ${{ runner.temp }}/reefvision-lineage-fixtures/${{ matrix.profile }}-verification.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
