name: Build Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/**"
      - "requirements/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/RELEASE_1.0.2.md"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Fast safety checks run before bootstrap / the multi-GB MSI build.
      - name: Validate Windows clean-install harness safeguards
        shell: pwsh
        run: ./scripts/test-windows-clean-install-harness.ps1

      - name: Reject unsafe ReefVision command installs before packaging
        shell: pwsh
        run: ./scripts/test-reefvision-command-preflight.ps1

      - name: Validate MSI updater paths and junction protections
        shell: pwsh
        run: ./scripts/test-reefvision-msi-update.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installed-Windows evidence policy regressions
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -p test_validate_windows_acceptance_report.py -v

      # Catch syntax regressions before installing large provider dependencies.
      # compileall is standard-library-only and does not download model weights.
      - name: Fail fast on backend Python syntax before packaging
        shell: pwsh
        run: |
          python -m compileall -q apps/api/reefvision
          if ($LASTEXITCODE -ne 0) {
            throw "Backend Python syntax preflight failed; refusing installer bootstrap."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore verified model bundle cache
        uses: actions/cache@v4
        with:
          path: .desktop/bundled-models
          key: ${{ runner.os }}-catalog-models-${{ hashFiles('config/model_catalog.json') }}

      - name: Bootstrap build environment
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -NonInteractive -SkipPlaywrightBrowser

      - name: Stage pinned Video Depth Anything source for packaging
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/install-video-depth-anything-source.py

      - name: Run focused backend tests
        shell: pwsh
        run: >-
          ./.venv/Scripts/python.exe -m pytest
          apps/api/reefvision/tests/test_desktop_runtime.py
          apps/api/reefvision/tests/test_desktop_real_migration_16.py
          apps/api/reefvision/tests/test_workflow_queue_multiprocess_16.py
          apps/api/reefvision/tests/test_workflow_queue_sqlite_contention_16.py
          apps/api/reefvision/tests/test_review_queue_bulk_sqlite_contention_16.py
          apps/api/reefvision/tests/test_model_install.py
          apps/api/reefvision/tests/test_bundled_models.py

      - name: Build MSI desktop installer with bundled checkpoints
        shell: pwsh
        run: |
          $LogPath = Join-Path $PWD ".desktop\windows-installer-build.log"
          New-Item -ItemType Directory -Path (Split-Path -Parent $LogPath) -Force | Out-Null
          npm run build:desktop *> $LogPath
          $ExitCode = $LASTEXITCODE
          if ($ExitCode -ne 0) {
            Write-Host "Desktop build failed. Final diagnostic output:" -ForegroundColor Red
            Get-Content -LiteralPath $LogPath -Tail 250
            exit $ExitCode
          }
          Get-Content -LiteralPath $LogPath -Tail 60

      # Retain the complete packaging log for installer-size and resource audits.
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-Windows-Build-Log
          path: .desktop/windows-installer-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Verify MSI/CAB provenance and exact source commit before upload
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'apps/web/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $bundle = 'apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi'
          python scripts/validate_msi_provenance.py --directory $bundle --expected-version $version --expected-commit (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) {
            throw 'MSI/CAB provenance validation failed; refusing artifact upload.'
          }

      - name: Upload complete Windows installer (MSI and external CABs)
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-Windows-Installer
          path: |
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.cab
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/build-provenance.json
          if-no-files-found: error
          retention-days: 14

  # Separate, disposable Windows runner: do not validate an MSI only on its build machine.
  windows-clean-install-acceptance:
    name: Install, launch, persist and uninstall 1.0.2 on fresh Windows
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve exact MSI and its external CABs
        uses: actions/download-artifact@v4
        with:
          name: ReefVision-Windows-Installer
          path: ${{ runner.temp }}/reefvision-1-0-2-installer

      - name: Verify MSI-declared cabinet payload before any install
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-2-installer'
          $msi = @(Get-ChildItem -LiteralPath $folder -Filter '*.msi' -File)
          $cabs = @(Get-ChildItem -LiteralPath $folder -Filter '*.cab' -File)
          if ($msi.Count -ne 1 -or $msi[0].Name -ne 'ReefVision_1.0.2_x64_en-US.msi') {
            throw 'Expected exactly the ReefVision 1.0.2 MSI.'
          }

          # Windows Installer Media is authoritative; cabinet count depends on
          # actual payload. '#name.cab' means embedded, not an external file.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi[0].FullName, 0)
          $versionView = $database.OpenView('SELECT `Value` FROM `Property` WHERE `Property`=''ProductVersion''')
          $versionView.Execute()
          $versionRecord = $versionView.Fetch()
          if ($null -eq $versionRecord -or $versionRecord.StringData(1) -ne '1.0.2') {
            throw 'MSI ProductVersion must be 1.0.2.'
          }
          $versionView.Close()

          $mediaView = $database.OpenView('SELECT `Cabinet` FROM `Media`')
          $mediaView.Execute()
          $requiredCabs = @()
          while ($record = $mediaView.Fetch()) {
            $cabinetName = [string]$record.StringData(1)
            if (-not $cabinetName -or $cabinetName.StartsWith('#')) { continue }
            if ($cabinetName -notmatch '^[^\\/:]+\.cab$') {
              throw "Unsafe or unsupported MSI external cabinet name: $cabinetName"
            }
            $requiredCabs += $cabinetName
          }
          $mediaView.Close()
          $requiredCabs = @($requiredCabs | Sort-Object -Unique)
          if ($requiredCabs.Count -eq 0) {
            throw 'MSI Media table does not declare any external CAB files.'
          }

          $actualCabs = @($cabs | ForEach-Object { $_.Name })
          $missing = @($requiredCabs | Where-Object { $_ -notin $actualCabs })
          $unexpected = @($actualCabs | Where-Object { $_ -notin $requiredCabs })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0 -or $actualCabs.Count -ne $requiredCabs.Count) {
            throw "MSI/CAB mismatch. MSI expects: $($requiredCabs -join ', '); artifact contains: $($actualCabs -join ', '); missing: $($missing -join ', '); unexpected: $($unexpected -join ', ')."
          }
          Write-Host "MSI references $($requiredCabs.Count) external CAB files, all present."

          foreach ($item in @($msi) + $cabs) {
            if ($item.Length -le 0) { throw "Empty installer file: $($item.Name)" }
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
            Write-Host "$($item.Name) SHA256=$hash"
          }

      - name: Test isolated MSI installation without developer runtimes on PATH
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-2-installer'
          $msi = Join-Path $folder 'ReefVision_1.0.2_x64_en-US.msi'
          # The runner may contain development tools, but the installed desktop
          # must function without any Python, Node.js, or Rust executable on PATH.
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              throw "Unexpected developer runtime on isolated PATH: $cmd"
            }
          }
          # Automatic PR checks must remain offline: pretrained checkpoints
          # require explicit researcher approval, not a CI default.
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -AcceptanceRoot 'C:\reefvision-1-0-2-disposable-acceptance' `
            -SkipUpgrade -DisposableTest -KeepArtifacts

      # Passing msiexec or exiting the harness is not enough: independently
      # verify every required installed-app gate, isolated migration state,
      # MSI SHA-256 and explicit upgrade SKIPPED (not falsely accepted).
      - name: Verify installed Windows acceptance evidence
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-2-installer'
          $msi = Join-Path $folder 'ReefVision_1.0.2_x64_en-US.msi'
          $reports = @(Get-ChildItem -Path '.artifacts' -Directory -Filter 'windows-clean-acceptance-*' |
            ForEach-Object { Get-Item -LiteralPath (Join-Path $_.FullName 'report.json') -ErrorAction SilentlyContinue })
          if ($reports.Count -ne 1) {
            throw "Expected exactly one installed-Windows acceptance report; found $($reports.Count)."
          }
          python scripts/validate_windows_acceptance_report.py --report $reports[0].FullName --expected-version 1.0.2 --expected-upgrade skipped --installer $msi
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed-Windows acceptance evidence verification failed.'
          }

      - name: Upload isolated Windows acceptance report and MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.0.2-Windows-Clean-Install-Evidence
          path: |
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
