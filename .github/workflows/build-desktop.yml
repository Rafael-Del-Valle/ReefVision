          $runJson = gh run view $env:REEFVISION_1_8_RUN --repo Rafael-Del-Valle/ReefVision --json headSha,conclusion,url
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the retained 1.8 installer run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.headSha -cne $env:REEFVISION_1_8_SOURCE) { throw 'The 1.8 installer run has a different source commit.' }
          $jobJson = gh api repos/Rafael-Del-Valle/ReefVision/actions/jobs/$env:REEFVISION_1_8_BUILD_JOB
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the original 1.8 manufacturing job.' }
          $binaryJob = $jobJson | ConvertFrom-Json
          if ([string]$binaryJob.run_id -cne $env:REEFVISION_1_8_RUN -or
              $binaryJob.head_sha -cne $env:REEFVISION_1_8_SOURCE -or
              $binaryJob.name -cne 'build-windows-installer' -or $binaryJob.conclusion -ne 'success') {
            throw 'The original 1.8 installer must come from the pinned successful manufacturing job.'
          }
          $previous = Join-Path $env:RUNNER_TEMP 'reefvision-1-8-0-installer'
          New-Item -ItemType Directory -Path $previous | Out-Null
          $artifactJson = gh api "repos/Rafael-Del-Valle/ReefVision/actions/runs/$env:REEFVISION_1_8_RUN/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the retained 1.8 transport parts.' }
          $transport = ($artifactJson | ConvertFrom-Json).artifacts
          $pinned = @(
            @{ id = 14687728605; digest = 'sha256:daeb01a281e413c02d3d3d31d3d4e135502137dfe1c98f6c98d3dca21d11edd0' }
            @{ id = 14687484229; digest = 'sha256:fc577bc4f464e33f2b46725ec6501831f968af5daa060f1149a2513f61cb3310' }
          )
          $previousTransport = @(foreach ($part in 1..2) {
            $name = "ReefVision-1.8.0-RC-Installer-Part-$part"
            $partMatches = @($transport | Where-Object { $_.name -ceq $name })
            $pin = $pinned[$part - 1]
            if ($partMatches.Count -ne 1 -or $partMatches[0].expired -or $partMatches[0].id -ne $pin.id -or
                $partMatches[0].digest -cne $pin.digest -or [string]$partMatches[0].workflow_run.id -cne $env:REEFVISION_1_8_RUN -or
                $partMatches[0].workflow_run.head_sha -cne $env:REEFVISION_1_8_SOURCE) {
              throw "Previous 1.8 transport part $part differs from the original verified artifact."
            }
            $partMatches[0] | Select-Object id,name,digest,size_in_bytes
          })
          foreach ($part in 1..2) {
            gh run download $env:REEFVISION_1_8_RUN --repo Rafael-Del-Valle/ReefVision --name "ReefVision-1.8.0-RC-Installer-Part-$part" --dir $previous
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the validated 1.8 installer part $part." }
          }
          $manifestPath = Join-Path $previous 'build-provenance.json'
          $digest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:REEFVISION_1_8_PROVENANCE_SHA256) { throw 'Retained 1.8 provenance differs from the pinned digest.' }
          $baseline = ./scripts/verify-windows-installer-payload.ps1 -InstallerDirectory $previous -Version '1.8.0' -ExpectedFilename 'ReefVision_1.8.0_x64_en-US.msi' -SourceCommit $env:REEFVISION_1_8_SOURCE -RequireProvenance
          $baselineMsiSha = ($baseline.files | Where-Object name -CEQ 'ReefVision_1.8.0_x64_en-US.msi').sha256
          if ($baselineMsiSha -cne $env:REEFVISION_1_8_MSI_SHA256) { throw 'Validated 1.8 MSI differs from its pinned digest.' }
          if (@($baseline.media | Where-Object { $_.cabinet -and -not $_.embedded }).Count -ne 6) {
            throw 'Validated 1.8.0 payload must contain all six external cabinets.'
          }
          New-Item -ItemType Directory -Path '.artifacts' -Force | Out-Null
          [ordered]@{
            baseline_run_id = [long]$env:REEFVISION_1_8_RUN
            baseline_run_url = $run.url
            baseline_workflow_conclusion = $run.conclusion
            baseline_build_job = $binaryJob.id
            baseline_build_url = $binaryJob.html_url
            baseline_source_commit = $env:REEFVISION_1_8_SOURCE
            baseline_provenance_sha256 = $digest
            baseline_artifact_transport = $previousTransport
            baseline = $baseline
            candidate_source_commit = $env:SOURCE_COMMIT
            candidate = $candidate
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath '.artifacts/windows-validated-18-upgrade-payload.json'

      - name: Exercise the validated 1.8 to 2.0 upgrade without developer runtimes on PATH
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'reefvision-2-0-0-installer\ReefVision_2.0.0_x64_en-US.msi'
          $previousMsi = Join-Path $env:RUNNER_TEMP 'reefvision-1-8-0-installer\ReefVision_1.8.0_x64_en-US.msi'
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) { throw "Unexpected developer runtime on isolated PATH: $cmd" }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -PreviousInstallerPath $previousMsi -PreviousInstallerSupportsIsolatedAcceptance -VerifyPreviousInstallerRejectsUpgradedProfile `
            -ExpectedVersion '2.0.0' -ExpectedSchemaRevision 'b20_compute_0001' `
            -ExpectedInitialSchemaRevision 'b18_spectral_0002' `
            -AcceptanceRoot 'C:\reefvision-2-0-0-upgrade-validated-1-8' `
            -DisposableTest -KeepArtifacts

      - name: Upload isolated validated upgrade report, installer digests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-2.0.0-RC-Windows-Validated-1.8.0-Upgrade-Evidence
          path: |
            .artifacts/windows-validated-18-upgrade-payload.json
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

