name: Build Windows Desktop

on:
  push:
    branches:
      - release/reefvision-101-external-test-20261011
    paths:
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/**"
      - "requirements/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/RELEASE_1.0.1.md"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Fast safety checks run before bootstrap / the multi-GB MSI build.
      - name: Validate Windows clean-install harness safeguards
        shell: pwsh
        run: ./scripts/test-windows-clean-install-harness.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore verified model bundle cache
        uses: actions/cache@v4
        with:
          path: .desktop/bundled-models
          key: ${{ runner.os }}-catalog-models-${{ hashFiles('config/model_catalog.json') }}

      - name: Bootstrap build environment
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -NonInteractive -SkipPlaywrightBrowser

      - name: Stage pinned Video Depth Anything source for packaging
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/install-video-depth-anything-source.py

      - name: Run focused backend tests
        shell: pwsh
        run: >-
          ./.venv/Scripts/python.exe -m pytest
          apps/api/reefvision/tests/test_desktop_runtime.py
          apps/api/reefvision/tests/test_model_install.py
          apps/api/reefvision/tests/test_bundled_models.py

      - name: Build MSI desktop installer with bundled checkpoints
        shell: pwsh
        run: |
          $LogPath = Join-Path $PWD ".desktop\windows-installer-build.log"
          New-Item -ItemType Directory -Path (Split-Path -Parent $LogPath) -Force | Out-Null
          npm run build:desktop *> $LogPath
          $ExitCode = $LASTEXITCODE
          if ($ExitCode -ne 0) {
            Write-Host "Desktop build failed. Final diagnostic output:" -ForegroundColor Red
            Get-Content -LiteralPath $LogPath -Tail 250
            exit $ExitCode
          }
          Get-Content -LiteralPath $LogPath -Tail 60

      # Retain the complete packaging log for installer-size and resource audits.
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-Windows-Build-Log
          path: .desktop/windows-installer-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload complete Windows installer (MSI and external CABs)
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-Windows-Installer
          path: |
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.cab
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/build-provenance.json
          if-no-files-found: error
          retention-days: 14

  # Separate, disposable Windows runner: do not validate an MSI only on its build machine.
  windows-clean-install-acceptance:
    name: Install, launch, persist and uninstall 1.0.1 on fresh Windows
    runs-on: windows-latest
    needs: build-windows-installer
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve exact MSI and its external CABs
        uses: actions/download-artifact@v4
        with:
          name: ReefVision-Windows-Installer
          path: ${{ runner.temp }}/reefvision-1-0-1-installer

      - name: Verify MSI-declared cabinet payload before any install
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-1-installer'
          $msi = @(Get-ChildItem -LiteralPath $folder -Filter '*.msi' -File)
          $cabs = @(Get-ChildItem -LiteralPath $folder -Filter '*.cab' -File)
          if ($msi.Count -ne 1 -or $msi[0].Name -ne 'ReefVision_1.0.1_x64_en-US.msi') {
            throw 'Expected exactly the ReefVision 1.0.1 MSI.'
          }

          # Windows Installer Media is authoritative; cabinet count depends on
          # actual payload. '#name.cab' means embedded, not an external file.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi[0].FullName, 0)
          $versionView = $database.OpenView('SELECT `Value` FROM `Property` WHERE `Property`=''ProductVersion''')
          $versionView.Execute()
          $versionRecord = $versionView.Fetch()
          if ($null -eq $versionRecord -or $versionRecord.StringData(1) -ne '1.0.1') {
            throw 'MSI ProductVersion must be 1.0.1.'
          }
          $versionView.Close()

          $mediaView = $database.OpenView('SELECT `Cabinet` FROM `Media`')
          $mediaView.Execute()
          $requiredCabs = @()
          while ($record = $mediaView.Fetch()) {
            $cabinetName = [string]$record.StringData(1)
            if (-not $cabinetName -or $cabinetName.StartsWith('#')) { continue }
            if ($cabinetName -notmatch '^[^\\/:]+\.cab$') {
              throw "Unsafe or unsupported MSI external cabinet name: $cabinetName"
            }
            $requiredCabs += $cabinetName
          }
          $mediaView.Close()
          $requiredCabs = @($requiredCabs | Sort-Object -Unique)
          if ($requiredCabs.Count -eq 0) {
            throw 'MSI Media table does not declare any external CAB files.'
          }

          $actualCabs = @($cabs | ForEach-Object { $_.Name })
          $missing = @($requiredCabs | Where-Object { $_ -notin $actualCabs })
          $unexpected = @($actualCabs | Where-Object { $_ -notin $requiredCabs })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0 -or $actualCabs.Count -ne $requiredCabs.Count) {
            throw "MSI/CAB mismatch. MSI expects: $($requiredCabs -join ', '); artifact contains: $($actualCabs -join ', '); missing: $($missing -join ', '); unexpected: $($unexpected -join ', ')."
          }
          Write-Host "MSI references $($requiredCabs.Count) external CAB files, all present."

          foreach ($item in @($msi) + $cabs) {
            if ($item.Length -le 0) { throw "Empty installer file: $($item.Name)" }
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
            Write-Host "$($item.Name) SHA256=$hash"
          }

      - name: Test isolated MSI installation without developer runtimes on PATH
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'reefvision-1-0-1-installer'
          $msi = Join-Path $folder 'ReefVision_1.0.1_x64_en-US.msi'
          # The runner may contain development tools, but the installed desktop
          # must function without any Python, Node.js, or Rust executable on PATH.
          $env:PATH = @(
            (Join-Path $env:SystemRoot 'System32'),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot 'System32\Wbem'),
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'),
            (Join-Path $env:ProgramFiles 'PowerShell\7')
          ) -join ';'
          foreach ($cmd in @('python', 'python3', 'node', 'npm', 'rustc', 'cargo')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              throw "Unexpected developer runtime on isolated PATH: $cmd"
            }
          }
          & ./scripts/acceptance-windows-clean-install.ps1 `
            -InstallerPath $msi `
            -AcceptanceRoot 'C:\reefvision-1-0-1-disposable-acceptance' `
            -SkipUpgrade -DisposableTest -KeepArtifacts -LiveSam2Acceptance

      - name: Upload isolated Windows acceptance report and MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReefVision-1.0.1-Windows-Clean-Install-Evidence
          path: |
            .artifacts/windows-clean-acceptance-*/report.json
            .artifacts/windows-clean-acceptance-*/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  publish-validated-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/reefvision-101-external-test-20261011'
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: Rafael-Del-Valle/ReefVision
      TESTED_SHA: ed3f7b58577fe640c006984bc99d1831dfb7e402
      RELEASE_TAG: v1.0.1-rc.1
      VALIDATED_RUN: "38184489604"
      MSI_SHA256: A0DE7EF60F7177C5DACE24030589FD8B6B78F55E24E0CBCE9C0D0E50D9530411

    name: Publish validated 1.0.1 test installer (no merge)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Confirm tested commit passed all mandatory gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 38184489565 38184489604 38184489536 38184489468; do
            status="$(gh run view "$run" --repo "$GH_REPO" --json headSha,conclusion --jq '.headSha + " " + .conclusion')"
            if [ "$status" != "$TESTED_SHA success" ]; then
              echo "::error::Required gate $run not successful on tested commit: $status"
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Prerelease $RELEASE_TAG already exists. Refusing to overwrite."
            exit 1
          fi

      - name: Download only the exact previously accepted installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir installer
          gh run download "$VALIDATED_RUN" --repo "$GH_REPO" --name ReefVision-Windows-Installer --dir installer

      - name: Verify MSI SHA-256 and all external CAB media
        run: |
          set -euo pipefail
          cd installer
          test -s ReefVision_1.0.1_x64_en-US.msi
          test -s build-provenance.json
          printf '%s  %s\n' "$MSI_SHA256" ReefVision_1.0.1_x64_en-US.msi | sha256sum --check
          test "$(find . -maxdepth 1 -type f -name 'rv*.cab' | wc -l)" -eq 5
          for number in 1 2 3 4 5; do
            test -s "rv$number.cab"
          done
          echo "Validated MSI and five accompanying external CAB files."

      - name: Draft user-facing test release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## ReefVision 1.0.1 — External PC Test Build

          **Pre-release for testing on a separate Windows PC; not the final stable release.**
          The stable v1.0.0 release remains unchanged. This build is from the fully
          tested 1.0.1 source commit ed3f7b58577fe640c006984bc99d1831dfb7e402.

          ### Changes
          - On-demand SAM 2.1 Hiera checkpoint acquisition and assisted segmentation.
          - Shift+1: SAM prompt segmentation; Shift+2: selected detector predictions.
          - COCO/YOLO annotation imports; model-derived class creation and review.
          - Floating confidence review with the inclusive 50% default cutoff.
          - Corrected Windows packaged SciPy startup for successful SAM inference.

          ### Windows install
          1. Download **ReefVision_1.0.1_x64_en-US.msi** and all **five** CAB
             files (rv1.cab through rv5.cab) from the Assets section.
          2. Put the MSI and all CABs in the same folder.
          3. Back up important ReefVision application data before upgrading.
          4. Close ReefVision; then run the MSI installer.
          5. Open ReefVision and test existing projects, model registration,
             SAM-assisted annotation, class creation and confidence review.

          The full clean-install acceptance passed on a separate Windows runner:
          https://github.com/Rafael-Del-Valle/ReefVision/actions/runs/38184489604

          **MSI SHA-256:** A0DE7EF60F7177C5DACE24030589FD8B6B78F55E24E0CBCE9C0D0E50D9530411

          **Limitations:** An installed-GUI manual hotkey/review smoke test and
          upgrade-in-place validation from v1.0.0 have not been completed.
          Please report issues before this is promoted to a stable release.
          NOTES

      - name: Stage draft GitHub prerelease and upload verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
            --target "$TESTED_SHA" --title "ReefVision 1.0.1 — External PC Test" \
            --notes-file release-notes.md --draft --prerelease
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" \
            installer/ReefVision_1.0.1_x64_en-US.msi \
            installer/rv1.cab installer/rv2.cab installer/rv3.cab \
            installer/rv4.cab installer/rv5.cab installer/build-provenance.json

      - name: Publish prerelease only after uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,isDraft,isPrerelease --jq '.'
