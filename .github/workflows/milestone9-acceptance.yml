name: Milestone 9 Acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 9 Python
        run: |
          python -m ruff check \
            apps/api/migrations/versions/0023_project_exchange_packages.py \
            apps/api/reefvision/api/routes/project_exchange.py \
            apps/api/reefvision/db/models/project_exchange_package.py \
            apps/api/reefvision/jobs/project_exchange.py \
            apps/api/reefvision/schemas/project_exchange.py \
            apps/api/reefvision/services/project_exchange.py \
            apps/api/reefvision/services/project_exchange_inspection.py \
            apps/api/reefvision/tests/test_project_exchange_phase9.py
          python -m ruff format --check \
            apps/api/migrations/versions/0023_project_exchange_packages.py \
            apps/api/reefvision/api/routes/project_exchange.py \
            apps/api/reefvision/db/models/project_exchange_package.py \
            apps/api/reefvision/jobs/project_exchange.py \
            apps/api/reefvision/schemas/project_exchange.py \
            apps/api/reefvision/services/project_exchange.py \
            apps/api/reefvision/services/project_exchange_inspection.py \
            apps/api/reefvision/tests/test_project_exchange_phase9.py
      - name: Run Milestone 9 interoperability tests
        run: python -m pytest apps/api/reefvision/tests/test_project_exchange_phase9.py -q
      - name: Verify 0023 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-m9"
          mkdir -p "$REEFVISION_DATA_ROOT"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0022
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          assert scripts.get_heads() == ['0023'], scripts.get_heads()
          PY
