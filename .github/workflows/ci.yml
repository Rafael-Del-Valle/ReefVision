name: CI

on:
  push:
    branches:
      - main
      # Run exact-head CI even while the isolated 1.6 draft PR has conflicts.
      - develop/reefvision-1.6
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interoperability]"
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - name: Show exact Ruff formatting diff on failure
        if: failure()
        run: python -m ruff format --diff apps/api
      - name: Lint read-only Alembic lineage preflight and regressions
        run: |
          python -m ruff check scripts/inspect-alembic-lineage.py scripts/tests/test_inspect_alembic_lineage_cli.py scripts/tests/test_live_wal_preflight_16.py scripts/tests/test_inspect_alembic_sidecar_boundaries_16.py
          python -m ruff format --check scripts/inspect-alembic-lineage.py scripts/tests/test_inspect_alembic_lineage_cli.py scripts/tests/test_live_wal_preflight_16.py scripts/tests/test_inspect_alembic_sidecar_boundaries_16.py
      - name: Show Alembic preflight Ruff formatting diff on failure
        if: failure()
        run: python -m ruff format --diff scripts/inspect-alembic-lineage.py
      - name: Test read-only Alembic lineage preflight (strict and informational)
        run: python -m pytest scripts/tests/test_inspect_alembic_lineage_cli.py scripts/tests/test_live_wal_preflight_16.py scripts/tests/test_inspect_alembic_sidecar_boundaries_16.py -v
      - name: Lint and test non-destructive Alembic collision audit
        run: |
          python -m ruff check scripts/audit-alembic-revision-collisions.py scripts/tests/test_audit_alembic_revision_collisions.py scripts/tests/test_audit_alembic_revision_collisions_cli.py scripts/tests/test_audit_alembic_parent_graph_16.py
          python -m ruff format --check scripts/audit-alembic-revision-collisions.py scripts/tests/test_audit_alembic_revision_collisions.py scripts/tests/test_audit_alembic_revision_collisions_cli.py scripts/tests/test_audit_alembic_parent_graph_16.py
          python -m pytest scripts/tests/test_audit_alembic_revision_collisions.py scripts/tests/test_audit_alembic_revision_collisions_cli.py -v scripts/tests/test_audit_alembic_parent_graph_16.py
          python scripts/audit-alembic-revision-collisions.py apps/api/migrations/versions
          python scripts/audit-alembic-revision-collisions.py --verify-parent-graph apps/api/migrations/versions
      - name: Verify 1.6 SQLite lineage and format-header comparison
        run: |
          python -m ruff check tests/test_inspect_sqlite_lineage_16_format_header.py
          python -m ruff format --check tests/test_inspect_sqlite_lineage_16_format_header.py
          python -m pytest tests/test_inspect_sqlite_lineage_16.py tests/test_inspect_sqlite_lineage_16_stamp_types.py tests/test_inspect_sqlite_lineage_16_format_header.py -v
      - name: Lint and test independent 1.6 research row-preservation gate
        run: |
          python -m ruff check scripts/verify-research-row-preservation-16.py scripts/tests/test_verify_research_row_preservation_16.py scripts/tests/test_verify_research_view_preservation_16.py scripts/tests/test_verify_research_foreign_key_timing_16.py scripts/tests/test_verify_research_conflict_policy_16.py
          python -m ruff format --check scripts/verify-research-row-preservation-16.py scripts/tests/test_verify_research_row_preservation_16.py scripts/tests/test_verify_research_view_preservation_16.py scripts/tests/test_verify_research_foreign_key_timing_16.py scripts/tests/test_verify_research_conflict_policy_16.py
          python -m pytest scripts/tests/test_verify_research_row_preservation_16.py scripts/tests/test_verify_research_view_preservation_16.py scripts/tests/test_verify_research_foreign_key_timing_16.py scripts/tests/test_verify_research_conflict_policy_16.py -v
      - name: Explain research preservation Ruff formatting mismatch
        if: failure()
        run: python -m ruff format --diff scripts/verify-research-row-preservation-16.py scripts/tests/test_verify_research_row_preservation_16.py scripts/tests/test_verify_research_view_preservation_16.py scripts/tests/test_verify_research_foreign_key_timing_16.py scripts/tests/test_verify_research_conflict_policy_16.py
      - run: python -m mypy -p reefvision
      - run: python -m pytest apps/api/reefvision/tests
      - name: Lint and test offline MSI/CAB provenance verifier (Python 3.11)
        run: |
          python -m ruff check scripts/validate_msi_provenance.py scripts/tests/test_validate_msi_provenance.py
          python -m ruff format --check scripts/validate_msi_provenance.py scripts/tests/test_validate_msi_provenance.py
          python -m pytest scripts/tests/test_validate_msi_provenance.py -v
      - name: Explain MSI/CAB provenance Ruff formatting mismatch
        if: failure()
        run: python -m ruff format --diff scripts/validate_msi_provenance.py scripts/tests/test_validate_msi_provenance.py
      - name: Verify installed Windows upgrade evidence contract (no MSI required)
        run: python -m unittest discover -s scripts/tests -p test_validate_windows_acceptance_report.py -v
      - name: Verify migrations
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/reefvision-migration-test"
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run lockfile:check
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - name: Show exact Prettier fixes when formatting fails
        if: failure()
        working-directory: apps/web
        run: |
          # Print the actual formatter diff for every file, rather than a stale
          # hard-coded shortlist that omitted the failing onboarding regression.
          # This diagnostic runs only after failure; it does not commit changes.
          npx prettier --write .
          git diff -- .
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  windows-research-preservation:
    name: Verify 1.6 research preservation against native Windows junctions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lightweight filesystem/SQLite tests: no desktop build or model download.
      - name: Install standalone test runner
        shell: pwsh
        run: python -m pip install pytest==8.3.5
      - name: Inspect synthetic Windows file-handle identity metadata
        shell: pwsh
        run: |
          @'
          import os
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder) / "synthetic-research.bin"
              path.write_bytes(b"scientific fixture")
              first = path.lstat()
              fd = os.open(path, os.O_RDONLY | getattr(os, "O_BINARY", 0) | getattr(os, "O_NONBLOCK", 0))
              try:
                  opened = os.fstat(fd)
              finally:
                  os.close(fd)
              fields = ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns", "st_mode", "st_nlink")
              print("Windows file identity differences:", {key: (getattr(first, key), getattr(opened, key)) for key in fields if getattr(first, key) != getattr(opened, key)})
          '@ | python -
      - name: Reject real NTFS junctions and research-directory substitutions
        shell: pwsh
        run: python -m pytest scripts/tests/test_verify_research_row_preservation_16.py scripts/tests/test_verify_research_view_preservation_16.py scripts/tests/test_verify_research_foreign_key_timing_16.py scripts/tests/test_verify_research_conflict_policy_16.py -v
      - name: Check read-only Alembic parent-graph regressions on Windows
        shell: pwsh
        run: python -m pytest scripts/tests/test_audit_alembic_parent_graph_16.py -v
      - name: Reject reserved Win32 installer cabinet names before file access
        shell: pwsh
        run: python -m pytest scripts/tests/test_validate_msi_provenance.py -v
      - name: Reject ambiguous Phase 11C concurrent acceptance reports
        shell: pwsh
        run: ./scripts/test-phase11c-report-selection.ps1
      - name: Test managed MSI updater preflight and saved-config isolation
        shell: pwsh
        run: ./scripts/test-reefvision-msi-update.ps1
      - name: Verify installed start/restart process isolation
        shell: pwsh
        run: ./scripts/test-reefvision-start-process-scope.ps1
      - name: Check start command configuration atomicity on Windows
        shell: pwsh
        run: ./scripts/test-reefvision-start-command-config.ps1
