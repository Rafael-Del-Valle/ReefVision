name: CI

on:
  push:
    branches:
      - main
      # PR #73 was merged while this release branch remains in development.
      # Test its exact HEAD on each push, not only the historical PR SHA.
      - develop/reefvision-1.0.3-consolidated
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interoperability]"
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m mypy -p reefvision
      - run: python -m pytest apps/api/reefvision/tests
      - name: Require Pillow JPEG decoder for camera codec regression
        run: python -c "from PIL import Image; assert 'JPEG' in Image.registered_extensions().values()"
      - name: Regression-test camera JPEG fixture inventory
        run: python -m unittest discover -s scripts -p 'test_verify_camera_jpeg_fixtures.py' -v
      - name: Verify migrations
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/reefvision-migration-test"
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run lockfile:check
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  windows-acceptance-collector:
    # Validate the evidence collector on a real Windows runner; this is NOT
    # MSI installation, WebView2 GUI, or GPU/scientific acceptance.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow for real JPEG decoding regressions on Windows
        shell: pwsh
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify Windows JPEG decoder availability
        shell: pwsh
        run: python -c "from PIL import Image; assert 'JPEG' in Image.registered_extensions().values()"
      - name: Regression-test camera JPEG fixture inventory on Windows
        shell: pwsh
        run: python -m unittest discover -s scripts -p 'test_verify_camera_jpeg_fixtures.py' -v
      - name: Regression-test read-only MSI/CAB evidence collection
        shell: pwsh
        run: ./scripts/windows/test-103-acceptance-evidence.ps1
