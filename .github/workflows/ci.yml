name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interoperability]"
      - name: Smoke-check actual-dataset acceptance CLI
        run: |
          python -m py_compile scripts/audit-saved-pose-workflow-19.py
          python scripts/audit-saved-pose-workflow-19.py --help
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m mypy -p reefvision
      - run: python -m pytest apps/api/reefvision/tests
      - name: Verify migrations
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/reefvision-migration.XXXXXX")"
          # The migration environment honors DATABASE_URL over DATA_DIR.
          # Explicitly pin both so downgrade base can only target the scratch DB.
          export REEFVISION_DATABASE_URL="sqlite:///$REEFVISION_DATA_DIR/reefvision.db"
          verify_revision() {
            python - "$1" <<'PY'
          import difflib
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          from alembic.config import Config
          from alembic.script import ScriptDirectory

          expected = sys.argv[1]
          database = Path(os.environ["REEFVISION_DATA_DIR"]) / "reefvision.db"
          with sqlite3.connect(database.as_uri() + "?mode=ro", uri=True) as conn:
              revisions = conn.execute("SELECT version_num FROM alembic_version").fetchall()
              integrity = conn.execute("PRAGMA integrity_check").fetchall()
              schema = conn.execute(
                  "SELECT type, name, tbl_name, sql FROM sqlite_schema "
                  "ORDER BY type, name"
              ).fetchall()
              violations = conn.execute("PRAGMA foreign_key_check").fetchall()
          if expected in ("head", "reupgraded"):
              head = ScriptDirectory.from_config(
                  Config("apps/api/alembic.ini")
              ).get_current_head()
              assert head is not None, "Migration graph has no head"
              assert revisions == [(head,)], revisions
          else:
              assert expected == "base" and not revisions, revisions
          assert integrity == [("ok",)], integrity
          assert not violations, violations
          # Compare the real migrated schema before and after the full roundtrip.
          snapshot = database.parent / "initial-schema.json"
          if expected == "head":
              snapshot.write_text(json.dumps(schema), encoding="utf-8")
          elif expected == "reupgraded":
              before = json.loads(snapshot.read_text(encoding="utf-8"))
              after = [list(row) for row in schema]
              if before != after:
                  diff = "\n".join(difflib.unified_diff(
                      json.dumps(before, indent=2).splitlines(),
                      json.dumps(after, indent=2).splitlines(),
                      fromfile="initial head",
                      tofile="re-upgraded head",
                      lineterm="",
                  ))
                  raise AssertionError(
                      f"Re-upgraded schema differs from the initial head:\n{diff}"
                  )
          print(f"Verified scratch database at {expected}: {revisions}")
          PY
          }
          alembic -c apps/api/alembic.ini upgrade head
          verify_revision head
          alembic -c apps/api/alembic.ini downgrade base
          verify_revision base
          alembic -c apps/api/alembic.ini upgrade head
          verify_revision reupgraded

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run lockfile:check
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
