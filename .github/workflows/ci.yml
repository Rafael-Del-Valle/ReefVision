name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - name: Run mypy
        shell: pwsh
        run: |
          python -m mypy apps/api/reefvision 2>&1 | Tee-Object -FilePath mypy-report.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy-report
          path: mypy-report.txt
      - run: python -m pytest apps/api/reefvision/tests
      - name: Verify migrations
        shell: pwsh
        run: |
          $env:REEFVISION_DATA_DIR = "$env:RUNNER_TEMP/reefvision-migration-test"
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini downgrade base

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run lockfile:check
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - name: Check frontend formatting
        id: prettier
        continue-on-error: true
        shell: pwsh
        working-directory: apps/web
        run: |
          npm run format:check 2>&1 | Tee-Object -FilePath prettier-report.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode
      - name: Upload Prettier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prettier-report
          path: apps/web/prettier-report.txt
      - name: Generate formatted frontend files
        if: steps.prettier.outcome == 'failure'
        shell: pwsh
        run: |
          npm --prefix apps/web exec prettier -- --write .
          $files = @(git diff --name-only -- apps/web)
          foreach ($file in $files) {
            $destination = Join-Path "formatted-frontend" $file
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $file -Destination $destination -Force
          }
      - name: Upload formatted frontend files
        if: steps.prettier.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-frontend-files
          path: formatted-frontend
      - name: Fail for frontend formatting
        if: steps.prettier.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
