name: Stabilization Freeze

on:
  push:
    branches:
      - "feat/all-phases-advancement"
  pull_request:
    paths:
      - ".reefvision-feature-freeze.json"
      - ".github/workflows/stabilization.yml"
      - "apps/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feature-freeze:
    name: No new production modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce feature freeze
        run: >-
          python scripts/check-feature-freeze.py
          --json-output feature-freeze-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-freeze-report
          path: feature-freeze-report.json
          if-no-files-found: ignore
          retention-days: 30

  validation-contract:
    name: Stabilization validation contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse release PowerShell gates
        shell: pwsh
        run: .\scripts\test-release-validation-syntax.ps1
      - name: Confirm required stabilization assets
        shell: pwsh
        run: |
          $required = @(
            ".reefvision-feature-freeze.json",
            "scripts/check-feature-freeze.py",
            "scripts/run-release-validation.ps1",
            "scripts/run-complete-release-validation.ps1",
            "scripts/verify-windows-msi.ps1",
            "scripts/validate-external-interchange.ps1",
            "docs/STABILIZATION_RELEASE_GATE.md"
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw "Missing stabilization assets: $($missing -join ', ')"
          }
