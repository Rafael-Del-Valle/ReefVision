name: Temporary Smoke Fix Formatter

on:
  push:
    branches:
      - feat/annotation-editor-smoke-fixes-20260916

permissions:
  contents: write

jobs:
  format-frontend:
    if: ${{ !contains(github.event.head_commit.message, '[skip formatter]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Format touched frontend files
        working-directory: apps/web
        run: >-
          npx prettier --write
          src/features/annotation-editor/AnnotationEditor.test.tsx
          src/features/annotation-editor/AnnotationEditor.tsx
          src/features/annotation-editor/MaskAnnotationWorkspace.test.tsx
          src/features/annotation-editor/MaskAnnotationWorkspace.tsx
          src/features/annotation-editor/PolygonMaskLayer.test.tsx
          src/features/annotation-editor/RasterMaskWorkspace.test.tsx
          src/features/gallery/Gallery.test.tsx
          src/features/gallery/Gallery.tsx
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/annotation-editor/AnnotationEditor.test.tsx \
                  apps/web/src/features/annotation-editor/AnnotationEditor.tsx \
                  apps/web/src/features/annotation-editor/MaskAnnotationWorkspace.test.tsx \
                  apps/web/src/features/annotation-editor/MaskAnnotationWorkspace.tsx \
                  apps/web/src/features/annotation-editor/PolygonMaskLayer.test.tsx \
                  apps/web/src/features/annotation-editor/RasterMaskWorkspace.test.tsx \
                  apps/web/src/features/gallery/Gallery.test.tsx \
                  apps/web/src/features/gallery/Gallery.tsx
          if git diff --cached --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git commit -m 'chore: format smoke-fix frontend [skip formatter]'
          git push origin HEAD:${{ github.ref_name }}
