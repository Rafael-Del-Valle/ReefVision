name: Apply ReefVision 1.6.2 Live Progress Patch

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-live-progress-1-6-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply live progress fallback and version bump
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"Expected {expected} matches in {path}, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "apps/web/src/features/models/ModelManager.tsx",
              "  const progressCurrent = job?.progress_current ?? 0;\n",
              "  const resultBytes = Number(job?.result_json?.bytes_downloaded ?? 0);\n"
              "  const progressCurrent = Math.max(\n"
              "    job?.progress_current ?? 0,\n"
              "    Number.isFinite(resultBytes) ? resultBytes : 0,\n"
              "  );\n",
          )

          replace_exact("pyproject.toml", 'version = "1.6.1"', 'version = "1.6.2"')
          replace_exact(
              "apps/api/reefvision/__init__.py",
              '__version__ = "1.6.1"',
              '__version__ = "1.6.2"',
          )
          replace_exact(
              "apps/api/reefvision/tests/test_version_consistency.py",
              'EXPECTED_VERSION = "1.6.1"',
              'EXPECTED_VERSION = "1.6.2"',
          )
          replace_exact(
              "apps/web/src-tauri/Cargo.toml",
              'version = "1.6.1"',
              'version = "1.6.2"',
          )

          for path in (
              "package.json",
              "apps/web/package.json",
              "apps/web/src-tauri/tauri.conf.json",
          ):
              file = Path(path)
              payload = json.loads(file.read_text(encoding="utf-8"))
              if payload.get("version") != "1.6.1":
                  raise RuntimeError(f"Unexpected version in {path}: {payload.get('version')}")
              payload["version"] = "1.6.2"
              file.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("apps/web/package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          if lock.get("version") != "1.6.1" or lock["packages"][""].get("version") != "1.6.1":
              raise RuntimeError("Unexpected package-lock versions")
          lock["version"] = "1.6.2"
          lock["packages"][""]["version"] = "1.6.2"
          lock_path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")

          cargo_lock_path = Path("apps/web/src-tauri/Cargo.lock")
          cargo_lock = cargo_lock_path.read_text(encoding="utf-8")
          pattern = re.compile(r'(name = "reefvision-desktop"\nversion = ")1\.6\.1("\n)')
          cargo_lock, count = pattern.subn(r'\g<1>1.6.2\g<2>', cargo_lock, count=1)
          if count != 1:
              raise RuntimeError("Could not update reefvision-desktop in Cargo.lock")
          cargo_lock_path.write_text(cargo_lock, encoding="utf-8")
          PY
      - name: Install formatting and test tools
        run: |
          python -m pip install -e ".[dev]"
          npm --prefix apps/web ci
      - name: Format patched files
        run: |
          python -m ruff format apps/api/reefvision/api/routes/jobs.py apps/api/reefvision/tests/test_live_model_install_progress.py
          npm --prefix apps/web exec -- prettier --write \
            src/features/models/ModelManager.tsx \
            package.json \
            package-lock.json \
            src-tauri/tauri.conf.json
      - name: Validate focused patch
        run: |
          python -m ruff check apps/api/reefvision/api/routes/jobs.py apps/api/reefvision/tests/test_live_model_install_progress.py
          python -m ruff format --check apps/api/reefvision/api/routes/jobs.py apps/api/reefvision/tests/test_live_model_install_progress.py
          python -m pytest \
            apps/api/reefvision/tests/test_live_model_install_progress.py \
            apps/api/reefvision/tests/test_version_consistency.py
          npm --prefix apps/web run format:check
          npm --prefix apps/web run typecheck
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pyproject.toml \
            package.json \
            apps/api/reefvision/__init__.py \
            apps/api/reefvision/api/routes/jobs.py \
            apps/api/reefvision/tests/test_live_model_install_progress.py \
            apps/api/reefvision/tests/test_version_consistency.py \
            apps/web/package.json \
            apps/web/package-lock.json \
            apps/web/src/features/models/ModelManager.tsx \
            apps/web/src-tauri/tauri.conf.json \
            apps/web/src-tauri/Cargo.toml \
            apps/web/src-tauri/Cargo.lock
          git commit -m "Release ReefVision 1.6.2 with live download progress"
          git push origin HEAD:fix/model-install-worker
