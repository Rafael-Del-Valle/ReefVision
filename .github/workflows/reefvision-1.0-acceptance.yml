name: ReefVision 1.0 Acceptance

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: reefvision-1-0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-science:
    name: Backend, migrations, and scientific workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interoperability]"
      - name: Ruff
        run: python -m ruff check apps/api
      - name: Ruff format
        run: python -m ruff format --check apps/api
      - name: Strict mypy
        run: python -m mypy apps/api/reefvision
      - name: Full backend suite
        run: python -m pytest apps/api/reefvision/tests -q
      - name: Focused 1.0 scientific workflow regression
        run: |
          python -m pytest \
            apps/api/reefvision/tests/test_active_learning_phase7.py \
            apps/api/reefvision/tests/test_active_learning_detection_acceptance_harness.py \
            apps/api/reefvision/tests/test_project_exchange_phase9.py \
            apps/api/reefvision/tests/test_project_exchange_roundtrip_v1.py \
            apps/api/reefvision/tests/test_coral_segmentation_acceptance_harness.py \
            apps/api/reefvision/tests/test_physical_calibration_acceptance_harness.py \
            apps/api/reefvision/tests/test_image_scale_calibration.py \
            apps/api/reefvision/tests/test_scale_calibration_contract.py \
            apps/api/reefvision/tests/test_scale_assistant_acceptance_harness.py \
            apps/api/reefvision/tests/test_scale_assistant_packaging_contract.py \
            apps/api/reefvision/tests/test_image_scale_project_exchange_v1.py \
            apps/api/reefvision/tests/test_scientist_ready_core_acceptance.py \
            apps/api/reefvision/tests/test_annotations.py \
            apps/api/reefvision/tests/test_model_inference.py \
            apps/api/reefvision/tests/test_segmentation_phase3.py \
            apps/api/reefvision/tests/test_mask_dataset_exports.py \
            apps/api/reefvision/tests/test_milestone2_import_acceptance.py \
            apps/api/reefvision/tests/test_dataset_versions.py \
            apps/api/reefvision/tests/test_workflow_graphs_phase10.py \
            apps/api/reefvision/tests/test_workflow_execution_phase10.py \
            apps/api/reefvision/tests/test_workflow_training_phase10.py \
            apps/api/reefvision/tests/test_workflow_depth_phase10.py \
            apps/api/reefvision/tests/test_video_tracking_evaluation_phase6.py \
            apps/api/reefvision/tests/test_video_tracking_benchmark_phase6.py \
            apps/api/reefvision/tests/test_video_track_exchange_phase6.py \
            apps/api/reefvision/tests/test_video_science_phase6.py \
            apps/api/reefvision/tests/test_video_activity_phase6.py \
            apps/api/reefvision/tests/test_video_occupancy_phase6.py \
            -q
      - name: Verify canonical migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-1-0-migrations"
          export REEFVISION_DATA_DIR="$REEFVISION_DATA_ROOT"
          mkdir -p "$REEFVISION_DATA_DIR"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          heads = scripts.get_heads()
          assert len(heads) == 1, f"Expected one canonical migration head, found {heads}"
          print(f"Canonical migration head: {heads[0]}")
          PY
          python -m alembic -c apps/api/alembic.ini downgrade base
          python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Measure immutable raster edit responsiveness (1.0.2)
        shell: bash
        env:
          REEFVISION_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/1.0.2-responsiveness
          printf 'source_head=%s\nrunner_os=%s\n' "$REEFVISION_SOURCE_HEAD" "$RUNNER_OS" > .artifacts/1.0.2-responsiveness/metadata.txt
          PYTHONPATH=apps/api python scripts/measure-raster-edit-responsiveness.py | tee .artifacts/1.0.2-responsiveness/raster.json
      - name: Upload raster responsiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.2-raster-responsiveness
          path: .artifacts/1.0.2-responsiveness/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Desktop frontend and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run lockfile:check
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - name: Record 1.0.2 annotation responsiveness metrics
        shell: bash
        working-directory: apps/web
        env:
          REEFVISION_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/1.0.2-responsiveness
          printf 'source_head=%s\nrunner_os=%s\nnode=%s\n' "$REEFVISION_SOURCE_HEAD" "$RUNNER_OS" "$(node --version)" > .artifacts/1.0.2-responsiveness/metadata.txt
          npx vitest run src/features/annotation-editor/annotationResponsiveness.test.ts 2>&1 | tee .artifacts/1.0.2-responsiveness/frontend-test.log
      - name: Upload frontend responsiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.2-frontend-responsiveness
          path: apps/web/.artifacts/1.0.2-responsiveness/
          if-no-files-found: warn
          retention-days: 30
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  windows-installer:
    name: Windows MSI release build
    runs-on: windows-latest
    needs:
      - backend-and-science
      - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Bootstrap desktop build environment
        shell: pwsh
        run: .\scripts\bootstrap.ps1
      - name: Stage pinned Video Depth Anything source
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/install-video-depth-anything-source.py
      - name: Build and verify ReefVision MSI
        shell: pwsh
        run: .\scripts\build-desktop.ps1 -TargetTriple x86_64-pc-windows-msvc
      - name: Upload MSI verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0-msi-diagnostics
          if-no-files-found: warn
          path: |
            apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/**
            ${{ runner.temp }}/reefvision-msi-*.log
            ${{ runner.temp }}/reefvision-sidecar-*.log
      - name: Upload release-validated Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0-windows-msi
          if-no-files-found: error
          path: apps/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/**

  sam2-live-acceptance:
    name: SAM 2.1 real online checkpoint and prompted inference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REEFVISION_LIVE_SAM2_ACCEPTANCE: "1"
      REEFVISION_ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/sam2-live-evidence
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SAM runtime dependencies matching proven live acceptance
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,advanced]"
          python -m pip freeze | grep -E '^(torch|torchvision|transformers|huggingface.hub|hf.xet)='

      - name: Execute real SAM model acquisition, CPU inference, and pending review evidence
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_patch_101_live_sam2_acceptance.py
          -q -s
      - name: Upload source-runtime SAM acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.1-sam2-live-evidence
          path: sam2-live-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  sam2-pinned-provider-acceptance:
    name: SAM 2.1 Windows-pinned provider versions on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REEFVISION_LIVE_SAM2_ACCEPTANCE: "1"
      REEFVISION_ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/sam2-pinned-evidence
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact Windows-pinned Transformers Hub and Xet runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,advanced]" -r requirements/advanced-providers-windows-py312.txt
          python -m pip check
          python -c "import importlib.metadata as m; expected={'transformers':'4.57.2','huggingface-hub':'0.36.0','hf-xet':'1.4.3'}; actual={k:m.version(k) for k in expected}; assert actual == expected, (actual,expected)"
      - name: Real SAM 2.1 Tiny download and inference with production pinned versions
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_patch_101_live_sam2_acceptance.py
          -q -s
      - name: Upload pinned SAM release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.1-sam2-pinned-provider-evidence
          path: sam2-pinned-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  sam2-windows-native-acceptance:
    name: SAM 2.1 real inference on native Windows Python 3.12
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      REEFVISION_LIVE_SAM2_ACCEPTANCE: "1"
      REEFVISION_ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/sam2-windows-native-evidence
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows-pinned provider packages and CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,advanced]" -r requirements/advanced-providers-windows-py312.txt
          python -m pip check
          python -c "import importlib.metadata as m; expected={'transformers':'4.57.2','huggingface-hub':'0.36.0','hf-xet':'1.4.3'}; actual={k:m.version(k) for k in expected}; assert actual == expected, (actual,expected)"
      - name: Download actual SAM 2.1 Tiny and run prompted inference on Windows CPU
        shell: pwsh
        run: >-
          python -m pytest
          apps/api/reefvision/tests/test_patch_101_live_sam2_acceptance.py
          -q -s
      - name: Preserve native Windows SAM inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefvision-1.0.1-sam2-windows-native-evidence
          path: sam2-windows-native-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    name: ReefVision 1.0 software gate
    runs-on: ubuntu-latest
    needs:
      - backend-and-science
      - frontend
      - windows-installer
      - sam2-live-acceptance
      - sam2-pinned-provider-acceptance
      - sam2-windows-native-acceptance
    steps:
      - run: |
          echo "ReefVision 1.0 automated software acceptance passed."
          echo "Representative biological/scientific validation and clean-machine manual acceptance remain separate evidence requirements."
