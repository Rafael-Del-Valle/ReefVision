name: M5 Dataset Ruff Format

on:
  push:
    branches:
      - integration/milestone5-classification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.2'
      - name: Format classification dataset service
        run: python -m ruff format apps/api/reefvision/services/classification_datasets.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/reefvision/services/classification_datasets.py
          git commit -m 'Format classification dataset service'
          git push
