name: M6 Delta Transplant

on:
  push:
    branches:
      - integration/milestone6-video

permissions:
  contents: write

jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch historical M6 lineage
        shell: bash
        run: |
          git fetch origin feat/video-fish-tracking-phase6 feat/classification-workflows-phase5
      - name: Apply only the M6 unique delta
        shell: bash
        run: |
          git diff --binary b24eeef84861e57eb436c22b5b84422809e8de4f 5bd0dacff1fd89ed9c5a521060885c8101b13f6e > /tmp/m6.patch
          git apply --3way /tmp/m6.patch || true
          git checkout --theirs apps/api/reefvision/tests/test_mask_migration_lineage.py
          git checkout --ours apps/web/src/features/classification/ClassificationWorkspace.test.tsx
          git add apps/api/reefvision/tests/test_mask_migration_lineage.py
          git add apps/web/src/features/classification/ClassificationWorkspace.test.tsx
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unexpected unresolved conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check
      - name: Commit transplant
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Milestone 6 video and fish tracking'
          git push
