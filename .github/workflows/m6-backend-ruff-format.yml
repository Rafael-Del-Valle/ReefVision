name: M6 Backend Ruff Format

on:
  push:
    branches:
      - integration/milestone6-video

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.2'
      - name: Format Milestone 6 backend files
        run: |
          python -m ruff format \
            apps/api/migrations/versions/0021_video_tracking_workflows.py \
            apps/api/reefvision/jobs/video_tracking.py \
            apps/api/reefvision/schemas/videos.py \
            apps/api/reefvision/services/video_assets.py \
            apps/api/reefvision/services/video_tracks.py \
            apps/api/reefvision/tests/test_video_tracking_phase6.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/migrations/versions/0021_video_tracking_workflows.py apps/api/reefvision/jobs/video_tracking.py apps/api/reefvision/schemas/videos.py apps/api/reefvision/services/video_assets.py apps/api/reefvision/services/video_tracks.py apps/api/reefvision/tests/test_video_tracking_phase6.py
          git commit -m 'Format Milestone 6 backend files'
          git push
