name: Publish Windows downloader

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-downloader.yml'
      - 'tools/windows-downloader/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-downloader.yml'
      - 'tools/windows-downloader/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build single-file Windows downloader
        shell: pwsh
        run: |
          dotnet publish tools/windows-downloader/ReefVision.Downloader.csproj -c Release -r win-x64 --self-contained true -o downloader-dist
          if ($LASTEXITCODE -ne 0) { throw 'Downloader build failed' }
          if (!(Test-Path downloader-dist/ReefVision_Windows_Downloader.exe)) { throw 'Downloader executable missing' }
      - name: Check release manifest without downloading installer payloads
        shell: pwsh
        run: |
          & ./downloader-dist/ReefVision_Windows_Downloader.exe --check-release
          if ($LASTEXITCODE -ne 0) { throw 'Newest release manifest check failed' }
          & ./downloader-dist/ReefVision_Windows_Downloader.exe --check-release --stable
          if ($LASTEXITCODE -ne 0) { throw 'Stable release manifest check failed' }
      - name: Publish updated downloader for stable and test downloads
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          foreach ($tag in @('v1.0.0', 'v1.0.1-rc.1')) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release $tag not found" }
            gh release upload $tag downloader-dist/ReefVision_Windows_Downloader.exe --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not upload downloader to $tag" }
          }
