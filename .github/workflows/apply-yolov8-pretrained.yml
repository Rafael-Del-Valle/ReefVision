name: Apply YOLOv8 Pretrained Catalog Fix

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-yolov8-pretrained.yml

permissions:
  contents: write

jobs:
  migrate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert YOLOv8 entries to managed pretrained checkpoints
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import tempfile
          import urllib.error
          import urllib.request
          from pathlib import Path

          catalog_path = Path("config/model_catalog.json")
          payload = json.loads(catalog_path.read_text(encoding="utf-8"))
          models = payload["models"]

          variants = ("n", "s", "m", "l", "x")
          release_tags = ("v8.3.0", "v8.2.0", "v8.1.0", "v0.0.0")
          resolved_assets: dict[str, dict[str, object]] = {}

          for variant in variants:
              filename = f"yolov8{variant}.pt"
              last_error: Exception | None = None
              for tag in release_tags:
                  url = f"https://github.com/ultralytics/assets/releases/download/{tag}/{filename}"
                  request = urllib.request.Request(url, headers={"User-Agent": "ReefVision-catalog-builder"})
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response, tempfile.NamedTemporaryFile() as tmp:
                          digest = hashlib.sha256()
                          size = 0
                          while chunk := response.read(1024 * 1024):
                              tmp.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)
                      resolved_assets[variant] = {
                          "filename": filename,
                          "source_url": url,
                          "revision": f"ultralytics-assets-{tag.removeprefix('v')}",
                          "sha256": digest.hexdigest(),
                          "size_bytes": size,
                      }
                      print(f"Resolved {filename}: {size} bytes from {tag}")
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      last_error = exc
              else:
                  raise RuntimeError(f"Could not resolve official Ultralytics asset {filename}: {last_error}")

          changed = False
          for variant in variants:
              catalog_id = f"ultralytics/yolov8/detect/{variant}"
              matches = [entry for entry in models if entry.get("catalog_id") == catalog_id]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one catalog entry for {catalog_id}, found {len(matches)}")

              entry = matches[0]
              asset = resolved_assets[variant]
              size_name = {
                  "n": "Nano",
                  "s": "Small",
                  "m": "Medium",
                  "l": "Large",
                  "x": "X",
              }[variant]
              updates = {
                  "display_name": f"YOLOv8 {size_name}",
                  "display_summary": (
                      f"Official YOLOv8 {size_name} pretrained object detector, managed and verified by ReefVision."
                  ),
                  "checkpoint_identifier": asset["filename"],
                  "checkpoint_source": "trusted_https_release",
                  "expected_checksum": asset["sha256"],
                  "expected_file_size": asset["size_bytes"],
                  "model_weight_license": (
                      "Official Ultralytics YOLOv8 pretrained weights; review Ultralytics licensing before use."
                  ),
                  "required_provider_pack": "ultralytics-base",
                  "known_limitations": [
                      "Installation requires network access for the initial trusted download.",
                      "Ultralytics must be available in the bundled provider runtime before training or inference.",
                  ],
                  "installation_state": "Not Installed",
                  "installation_reason": "The verified pretrained checkpoint is not installed yet.",
                  "requires_confirmation": True,
                  "selection_kind": "managed_catalog_model",
                  "inference": True,
                  "inference_supported": True,
                  "download_source_type": "trusted_https_release",
                  "expected_files": [asset],
                  "expected_size": asset["size_bytes"],
                  "license_summary": (
                      "Ultralytics pretrained weights; AGPL-3.0 or an applicable Ultralytics enterprise license."
                  ),
                  "provider_pack_id": "ultralytics-base",
              }
              for key, value in updates.items():
                  if entry.get(key) != value:
                      entry[key] = value
                      changed = True

          if changed:
              catalog_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          else:
              print("YOLOv8 catalog entries already use managed pretrained checkpoints.")

          test_path = Path("tests/test_model_catalog_yolov8_pretrained.py")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(
              '''import json
          from pathlib import Path


          def test_yolov8_detection_catalog_uses_managed_pretrained_weights() -> None:
              catalog_path = Path(__file__).resolve().parents[1] / "config" / "model_catalog.json"
              payload = json.loads(catalog_path.read_text(encoding="utf-8"))
              entries = {
                  entry["catalog_id"]: entry
                  for entry in payload["models"]
                  if entry["catalog_id"].startswith("ultralytics/yolov8/detect/")
              }

              expected_ids = {
                  f"ultralytics/yolov8/detect/{variant}" for variant in ("n", "s", "m", "l", "x")
              }
              assert set(entries) == expected_ids

              for catalog_id, entry in entries.items():
                  variant = catalog_id.rsplit("/", 1)[-1]
                  filename = f"yolov8{variant}.pt"
                  assert entry["selection_kind"] == "managed_catalog_model"
                  assert entry["checkpoint_identifier"] == filename
                  assert entry["checkpoint_source"] == "trusted_https_release"
                  assert entry["architecture_reference"] == f"yolov8{variant}.yaml"
                  assert entry["inference"] is True
                  assert entry["inference_supported"] is True
                  assert entry["installation_state"] == "Not Installed"
                  assert entry["provider_pack_id"] == "ultralytics-base"
                  assert entry["expected_checksum"]
                  assert entry["expected_file_size"] > 0
                  assert entry["expected_files"] == [
                      {
                          "filename": filename,
                          "source_url": entry["expected_files"][0]["source_url"],
                          "revision": entry["expected_files"][0]["revision"],
                          "sha256": entry["expected_checksum"],
                          "size_bytes": entry["expected_file_size"],
                      }
                  ]
                  assert entry["expected_files"][0]["source_url"].startswith(
                      "https://github.com/ultralytics/assets/releases/download/"
                  )
          ''',
              encoding="utf-8",
          )
          PY

      - name: Validate catalog and focused test
        shell: bash
        run: |
          python -m json.tool config/model_catalog.json > /dev/null
          python -m pytest tests/test_model_catalog_yolov8_pretrained.py

      - name: Commit catalog fix
        shell: bash
        run: |
          if git diff --quiet -- config/model_catalog.json tests/test_model_catalog_yolov8_pretrained.py; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/model_catalog.json tests/test_model_catalog_yolov8_pretrained.py
          git commit -m "Add managed YOLOv8 pretrained checkpoints"
          git push origin HEAD:fix/model-install-worker
