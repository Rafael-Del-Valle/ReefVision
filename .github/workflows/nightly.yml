name: Nightly Full Acceptance

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-acceptance
  cancel-in-progress: true

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: apps/web
      - name: Backend full suite and coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "not provider and not gpu" \
            --cov=apps/api/reefvision --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov --cov-report=term-missing \
            --junitxml=backend-junit.xml 2>&1 | tee nightly-backend.log
      - name: Frontend full suite
        shell: bash
        working-directory: apps/web
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee ../../nightly-frontend.log
          npm run typecheck 2>&1 | tee -a ../../nightly-frontend.log
          npm run test -- --reporter=verbose 2>&1 | tee -a ../../nightly-frontend.log
          npx playwright install --with-deps chromium
          npm run test:e2e 2>&1 | tee -a ../../nightly-frontend.log
          npm run build 2>&1 | tee -a ../../nightly-frontend.log
      - name: Migration round trip
        shell: bash
        run: |
          set -o pipefail
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/nightly-migrations"
          alembic -c apps/api/alembic.ini upgrade head 2>&1 | tee nightly-migrations.log
          alembic -c apps/api/alembic.ini downgrade 0019 2>&1 | tee -a nightly-migrations.log
          alembic -c apps/api/alembic.ini upgrade head 2>&1 | tee -a nightly-migrations.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-acceptance
          path: |
            coverage.xml
            htmlcov
            backend-junit.xml
            nightly-*.log
            apps/web/playwright-report
            apps/web/test-results
            apps/web/dist
          if-no-files-found: ignore
          retention-days: 30

  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Bootstrap provider-free acceptance environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          npm --prefix apps/web ci
      - name: Run all-phase acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\run-all-phases-acceptance.ps1 *>&1 | Tee-Object -FilePath nightly-windows.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-acceptance
          path: |
            nightly-windows.log
            .artifacts
          if-no-files-found: ignore
          retention-days: 30
