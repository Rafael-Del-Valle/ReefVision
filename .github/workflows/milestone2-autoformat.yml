name: Milestone 2 Autoformat

on:
  pull_request:
    paths:
      - ".github/workflows/milestone2-autoformat.yml"
      - "apps/api/reefvision/services/enhanced_annotation_imports.py"
      - "apps/api/reefvision/tests/test_annotation_imports.py"
      - "apps/api/reefvision/tests/test_milestone2_import_acceptance.py"
      - "apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.2
      - name: Shorten two importer diagnostics before formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/reefvision/services/enhanced_annotation_imports.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'detail="No unique ReefVision image matched this CoralNet-Toolbox image path",',
              'detail="No unique ReefVision image matched this CoralNet image path",',
          )
          text = text.replace(
              'detail=f"Semantic mask class {real_class_id} has no label-map entry",',
              'detail=f"Semantic class {real_class_id} has no label-map entry",',
          )
          path.write_text(text, encoding="utf-8")
      - run: python -m ruff format apps/api/reefvision/services/enhanced_annotation_imports.py apps/api/reefvision/tests/test_annotation_imports.py apps/api/reefvision/tests/test_milestone2_import_acceptance.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write tests/e2e/milestone2-mask-acceptance.spec.ts
        working-directory: apps/web
      - name: Commit formatter output if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/reefvision/services/enhanced_annotation_imports.py \
                  apps/api/reefvision/tests/test_annotation_imports.py \
                  apps/api/reefvision/tests/test_milestone2_import_acceptance.py \
                  apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts
          if git diff --cached --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git commit -m "Format Milestone 2 completion files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
