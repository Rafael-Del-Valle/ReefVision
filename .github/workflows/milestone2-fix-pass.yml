name: Milestone 2 Fix Pass

on:
  pull_request:
    paths:
      - ".github/workflows/milestone2-fix-pass.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply validated backend and E2E fixes
        shell: python
        run: |
          from pathlib import Path

          importer = Path("apps/api/reefvision/services/enhanced_annotation_imports.py")
          text = importer.read_text(encoding="utf-8")
          old = 'stored_class_id = int(item.get("class_id"))'
          new = 'stored_class_id = int(str(item.get("class_id")))'
          if old not in text:
              raise SystemExit("Expected semantic class-ID parse was not found")
          importer.write_text(text.replace(old, new, 1), encoding="utf-8")

          annotations = Path("apps/api/reefvision/services/annotations.py")
          text = annotations.read_text(encoding="utf-8")
          old = '                existing_mask.source_type = "human"\n'
          if old not in text:
              raise SystemExit("Expected source_type overwrite was not found")
          annotations.write_text(text.replace(old, "", 1), encoding="utf-8")

          e2e = Path("apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts")
          text = e2e.read_text(encoding="utf-8")
          old = '''  await page.mouse.click(polygonBox.x + polygonBox.width / 2, polygonBox.y + 2);\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(5);\n\n  await page.getByTestId("delete-polygon-node").click();\n  await page.locator(`[data-testid^="mask-vertex-${maskId}-"]`).last().click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(4);\n'''
          new = '''  await page.mouse.click(polygonBox.x + polygonBox.width / 2, polygonBox.y + 2);\n  await page.getByTestId("move-polygon-nodes").click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(5);\n\n  await page.getByTestId("delete-polygon-node").click();\n  await page.locator(`[data-testid^="mask-vertex-${maskId}-"]`).last().click();\n  await page.getByTestId("move-polygon-nodes").click();\n  await expect(\n    page.locator(`[data-testid^="mask-vertex-${maskId}-"]`),\n  ).toHaveCount(4);\n'''
          if old not in text:
              raise SystemExit("Expected node-edit E2E block was not found")
          e2e.write_text(text.replace(old, new, 1), encoding="utf-8")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.2
      - run: python -m ruff format apps/api/reefvision/services/enhanced_annotation_imports.py apps/api/reefvision/services/annotations.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write tests/e2e/milestone2-mask-acceptance.spec.ts
        working-directory: apps/web
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/reefvision/services/enhanced_annotation_imports.py \
                  apps/api/reefvision/services/annotations.py \
                  apps/web/tests/e2e/milestone2-mask-acceptance.spec.ts
          git commit -m "Fix Milestone 2 provenance typing and node acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
