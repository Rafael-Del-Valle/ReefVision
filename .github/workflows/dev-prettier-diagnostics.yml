name: Development Prettier Diagnostics
on:
  pull_request:
    paths:
      - "apps/web/src/**"
      - ".github/workflows/dev-prettier-diagnostics.yml"

jobs:
  prettier-diff:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Print required Prettier changes (never modify repository)
        working-directory: apps/web
        shell: bash
        run: |
          npm ci --ignore-scripts
          for path in src/features/training/SegmentationEvaluationPanel.tsx src/features/training/SegmentationEvaluationPanel.test.tsx src/features/training/segmentationEvaluationApi.ts src/features/review-queues/QuickConfidenceReviewDialog.tsx src/features/review-queues/QuickConfidenceReviewDialog.test.tsx src/features/review-queues/ReviewQueueCoordinationPanel.tsx src/features/review-queues/ReviewQueueCoordinationPanel.test.tsx src/features/annotation-editor/AnnotationEditor.tsx src/features/annotation-editor/AnnotationEditor.test.tsx src/features/annotation-editor/viewportCulling.ts src/features/annotation-editor/viewportCulling.test.ts src/features/gallery/Gallery.tsx src/features/gallery/Gallery.test.tsx tests/e2e/annotation-editor.spec.ts src/features/review-queues/ReviewQueueBulkTriage.tsx src/features/review-queues/ReviewQueueBulkTriage.test.tsx; do
            if [ -f "$path" ]; then
              npx prettier --write "$path"
            fi
          done
          git diff -- src/features/training/SegmentationEvaluationPanel.tsx src/features/training/SegmentationEvaluationPanel.test.tsx src/features/training/segmentationEvaluationApi.ts src/features/review-queues/QuickConfidenceReviewDialog.tsx src/features/review-queues/QuickConfidenceReviewDialog.test.tsx src/features/review-queues/ReviewQueueCoordinationPanel.tsx src/features/review-queues/ReviewQueueCoordinationPanel.test.tsx src/features/annotation-editor/AnnotationEditor.tsx src/features/annotation-editor/AnnotationEditor.test.tsx src/features/annotation-editor/viewportCulling.ts src/features/annotation-editor/viewportCulling.test.ts src/features/gallery/Gallery.tsx src/features/gallery/Gallery.test.tsx tests/e2e/annotation-editor.spec.ts src/features/review-queues/ReviewQueueBulkTriage.tsx src/features/review-queues/ReviewQueueBulkTriage.test.tsx
          # Diagnostics only: the normal format:check remains the release gate.
