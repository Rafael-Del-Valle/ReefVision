name: Temporary Runtime Verification

on:
  push:
    branches:
      - feat/annotation-editor-smoke-fixes-20260916

jobs:
  backend-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: "ignore::DeprecationWarning"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Full backend suite
        run: python -m pytest apps/api/reefvision/tests -q
      - name: Verify canonical migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_ROOT="$RUNNER_TEMP/reefvision-runtime-verification"
          export REEFVISION_DATA_DIR="$REEFVISION_DATA_ROOT"
          mkdir -p "$REEFVISION_DATA_DIR"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          scripts = ScriptDirectory.from_config(Config('apps/api/alembic.ini'))
          heads = scripts.get_heads()
          assert len(heads) == 1, f"Expected one canonical migration head, found {heads}"
          print(f"Canonical migration head: {heads[0]}")
          PY
          python -m alembic -c apps/api/alembic.ini downgrade base
          python -m alembic -c apps/api/alembic.ini upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Production frontend build
        run: npm run build
        working-directory: apps/web

  validated-base-e2e-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de03d5862759bf887cc314517728d7954ca3aacd
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E on validated 1.0.2 source under current runner
        run: npm run test:e2e
        working-directory: apps/web


  validated-base-mypy-comparison:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de03d5862759bf887cc314517728d7954ca3aacd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Mypy on validated 1.0.2 source
        run: python -m mypy apps/api/reefvision
