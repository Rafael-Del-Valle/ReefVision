name: M4 Pairwise Autofix

on:
  push:
    branches:
      - integration/milestone4-measurements
    paths:
      - ".github/workflows/m4-pairwise-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/milestone4-measurements
      - name: Apply exact Ruff RUF007 modernization
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/reefvision/services/mask_measurements.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import zipfile\nfrom math import hypot, nan, pi\n",
              "import zipfile\nfrom itertools import pairwise\nfrom math import hypot, nan, pi\n",
              1,
          )
          text = text.replace(
              "for first, second in zip(points, points[1:], strict=False)",
              "for first, second in pairwise(points)",
          )
          path.write_text(text, encoding="utf-8")
      - name: Verify fix
        run: |
          python -m pip install ruff==0.16.2
          python -m ruff check apps/api/reefvision/services/mask_measurements.py
          python -m ruff format --check apps/api/reefvision/services/mask_measurements.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/reefvision/services/mask_measurements.py
          git commit -m "Modernize measurement centerline iteration" || exit 0
          git push origin HEAD:integration/milestone4-measurements
