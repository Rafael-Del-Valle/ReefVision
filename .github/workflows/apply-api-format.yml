name: Apply API Formatting

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-api-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.9,<1"
      - run: python -m ruff format apps/api
      - run: python -m ruff format --check apps/api
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git commit -m "Format API changes"
          git push origin HEAD:fix/model-install-worker
