name: M7 Delta Transplant

on:
  push:
    branches:
      - integration/milestone7-on-m6

permissions:
  contents: write

jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch historical M6 and M7 refs
        run: git fetch origin feat/video-fish-tracking-phase6 feat/active-learning-phase7
      - name: Apply only the historical M7 delta
        shell: bash
        run: |
          set +e
          git diff --binary 5bd0dacff1fd89ed9c5a521060885c8101b13f6e 9cc7cc90590941be82aed91137d1f413e3495a31 > /tmp/m7.patch
          git apply --3way /tmp/m7.patch
          apply_status=$?
          set -e

          if git diff --name-only --diff-filter=U | grep -qx 'apps/api/reefvision/api/router.py'; then
            git checkout --ours apps/api/reefvision/api/router.py
            python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/reefvision/api/router.py')
          text = path.read_text(encoding='utf-8')
          import_line = 'from reefvision.api.routes.active_learning import router as active_learning_router\n'
          if import_line not in text:
              anchor = 'from reefvision.api.routes.annotations import router as annotations_router\n'
              text = text.replace(anchor, import_line + anchor)
          include_line = 'api_router.include_router(active_learning_router)\n'
          if include_line not in text:
              text = text.rstrip() + '\n' + include_line
          path.write_text(text, encoding='utf-8')
          PY
            git add apps/api/reefvision/api/router.py
          fi

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "Unresolved transplant conflicts:"
            echo "$unmerged"
            exit 1
          fi
          if [ "$apply_status" -ne 0 ]; then
            echo 'Historical patch reported conflicts; resolved known router conflict and verified no others remain.'
          fi
          git diff --check
      - name: Commit transplant
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Milestone 7 active learning foundation'
          git push
