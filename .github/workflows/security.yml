name: Dependency Security

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e ".[dev]"
      - name: Audit installed Python dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip_audit --format json --output python-audit.json 2>&1 | tee python-audit.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-audit
          path: |
            python-audit.json
            python-audit.log
          if-no-files-found: ignore
          retention-days: 30

  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit Node dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json > ../../node-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-security-audit
          path: node-audit.json
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
