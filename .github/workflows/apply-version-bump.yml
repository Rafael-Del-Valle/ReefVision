name: Apply ReefVision 1.6.1 Version Bump

on:
  push:
    branches:
      - fix/model-install-worker
    paths:
      - .github/workflows/apply-version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-install-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update authoritative version sources
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          old = "1.6.0"
          new = "1.6.1"

          def replace_exact(path: str, old_text: str, new_text: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old_text)
              if count != expected:
                  raise RuntimeError(f"Expected {expected} matches in {path}, found {count}")
              file.write_text(text.replace(old_text, new_text), encoding="utf-8")

          replace_exact("pyproject.toml", 'version = "1.6.0"', 'version = "1.6.1"')
          replace_exact("apps/api/reefvision/__init__.py", '__version__ = "1.6.0"', '__version__ = "1.6.1"')
          replace_exact(
              "apps/api/reefvision/tests/test_version_consistency.py",
              'EXPECTED_VERSION = "1.6.0"',
              'EXPECTED_VERSION = "1.6.1"',
          )
          replace_exact(
              "apps/web/src-tauri/Cargo.toml",
              'version = "1.6.0"',
              'version = "1.6.1"',
          )

          for path in (
              "package.json",
              "apps/web/package.json",
              "apps/web/src-tauri/tauri.conf.json",
          ):
              file = Path(path)
              payload = json.loads(file.read_text(encoding="utf-8"))
              if payload.get("version") != old:
                  raise RuntimeError(f"Unexpected version in {path}: {payload.get('version')}")
              payload["version"] = new
              file.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("apps/web/package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          if lock.get("version") != old or lock["packages"][""] .get("version") != old:
              raise RuntimeError("Unexpected package-lock versions")
          lock["version"] = new
          lock["packages"][""]["version"] = new
          lock_path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")

          cargo_lock_path = Path("apps/web/src-tauri/Cargo.lock")
          cargo_lock = cargo_lock_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(name = "reefvision-desktop"\nversion = ")1\.6\.0("\n)'
          )
          cargo_lock, count = pattern.subn(r'\g<1>1.6.1\g<2>', cargo_lock, count=1)
          if count != 1:
              raise RuntimeError("Could not update reefvision-desktop in Cargo.lock")
          cargo_lock_path.write_text(cargo_lock, encoding="utf-8")
          PY
      - name: Validate version consistency
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest apps/api/reefvision/tests/test_version_consistency.py
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pyproject.toml \
            package.json \
            apps/api/reefvision/__init__.py \
            apps/api/reefvision/tests/test_version_consistency.py \
            apps/web/package.json \
            apps/web/package-lock.json \
            apps/web/src-tauri/tauri.conf.json \
            apps/web/src-tauri/Cargo.toml \
            apps/web/src-tauri/Cargo.lock
          git commit -m "Bump ReefVision to 1.6.1"
          git push origin HEAD:fix/model-install-worker
