name: Annotation Import Tests

on:
  pull_request:
    paths:
      - ".github/workflows/annotation-import-tests.yml"
      - "apps/api/reefvision/api/routes/annotation_imports.py"
      - "apps/api/reefvision/schemas/annotation_imports.py"
      - "apps/api/reefvision/services/annotation_imports.py"
      - "apps/api/reefvision/tests/test_annotation_imports.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  annotation-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check apps/api/reefvision/services/annotation_imports.py apps/api/reefvision/api/routes/annotation_imports.py apps/api/reefvision/schemas/annotation_imports.py apps/api/reefvision/tests/test_annotation_imports.py
      - run: python -m ruff format --check apps/api/reefvision/services/annotation_imports.py apps/api/reefvision/api/routes/annotation_imports.py apps/api/reefvision/schemas/annotation_imports.py apps/api/reefvision/tests/test_annotation_imports.py
      - run: python -m pytest apps/api/reefvision/tests/test_annotation_imports.py
