name: Milestone 4 Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/milestone4-acceptance.yml"
      - "apps/api/migrations/**"
      - "apps/api/reefvision/api/routes/measurements.py"
      - "apps/api/reefvision/schemas/measurements.py"
      - "apps/api/reefvision/services/mask_measurements.py"
      - "apps/api/reefvision/services/measurement_analytics.py"
      - "apps/api/reefvision/services/measurement_aware_dataset_versions.py"
      - "apps/api/reefvision/tests/test_mask_measurements.py"
      - "apps/api/reefvision/tests/test_coral_measurements_phase4.py"
      - "apps/web/src/features/annotation-editor/CenterlineMeasurementLayer.tsx"
      - "apps/web/src/features/annotation-editor/MaskMeasurementPanel*.tsx"
      - "apps/web/src/features/annotation-editor/maskMeasurementsApi.ts"
      - "scripts/phase4-acceptance.ps1"
  workflow_dispatch:

jobs:
  measurements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format Milestone 4 Python
        run: |
          python -m ruff check \
            apps/api/reefvision/api/routes/measurements.py \
            apps/api/reefvision/schemas/measurements.py \
            apps/api/reefvision/services/mask_measurements.py \
            apps/api/reefvision/services/measurement_analytics.py \
            apps/api/reefvision/services/measurement_aware_dataset_versions.py \
            apps/api/reefvision/tests/test_mask_measurements.py \
            apps/api/reefvision/tests/test_coral_measurements_phase4.py
          python -m ruff format --check \
            apps/api/reefvision/api/routes/measurements.py \
            apps/api/reefvision/schemas/measurements.py \
            apps/api/reefvision/services/mask_measurements.py \
            apps/api/reefvision/services/measurement_analytics.py \
            apps/api/reefvision/services/measurement_aware_dataset_versions.py \
            apps/api/reefvision/tests/test_mask_measurements.py \
            apps/api/reefvision/tests/test_coral_measurements_phase4.py
      - name: Run Milestone 4 measurement tests
        run: |
          python -m pytest \
            apps/api/reefvision/tests/test_mask_measurements.py \
            apps/api/reefvision/tests/test_coral_measurements_phase4.py \
            apps/api/reefvision/tests/test_dataset_versions.py
      - name: Verify 0019 migration roundtrip
        shell: bash
        run: |
          export REEFVISION_DATA_DIR="$RUNNER_TEMP/reefvision-milestone4-migrations"
          alembic -c apps/api/alembic.ini upgrade 0018
          alembic -c apps/api/alembic.ini upgrade 0019
          alembic -c apps/api/alembic.ini downgrade 0018
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini current
