[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefvision"
version = "1.7.0"
description = "Local-first scientific image annotation and computer vision platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rafael Del Valle" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.139,<1",
  "pydantic-settings>=2.7,<3",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pyinstaller>=6.21,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["reefvision*"]
exclude = ["reefvision.tests*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/reefvision/tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast deterministic test that does not exercise a complete persisted workflow",
  "integration: persisted API, worker, migration, import/export, training, video, or workflow test",
  "phase1: roadmap Phase 1 foundation coverage",
  "phase2: roadmap Phase 2 annotation coverage",
  "phase3: roadmap Phase 3 segmentation coverage",
  "phase4: roadmap Phase 4 measurement coverage",
  "phase5: roadmap Phase 5 classification coverage",
  "phase6: roadmap Phase 6 video and tracking coverage",
  "phase7: roadmap Phase 7 active-learning coverage",
  "phase8: roadmap Phase 8 provider and prompt-assist coverage",
  "phase9: roadmap Phase 9 interoperability coverage",
  "phase10: roadmap Phase 10 workflow coverage",
  "provider: test requiring a local optional ML provider",
  "gpu: test requiring a CUDA-compatible GPU",
  "slow: deterministic test intentionally excluded from fast pull-request gates",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::ResourceWarning",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["apps/api/reefvision"]
omit = [
  "apps/api/reefvision/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reefvision"]
mypy_path = "apps/api"
plugins = ["pydantic.mypy"]
exclude = ["apps/api/reefvision/tests/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "numpy", "psutil", "segment_anything", "torch", "ultralytics"]
ignore_missing_imports = true
