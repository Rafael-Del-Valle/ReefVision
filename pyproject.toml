[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefvision"
version = "1.7.0"
description = "Local-first scientific image annotation and computer vision platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rafael Del Valle" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.139,<1",
  "pydantic-settings>=2.7,<3",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "ultralytics==8.3.228",
  "pyinstaller>=6.21,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "scikit-image>=0.24,<1",
  "types-networkx>=3.2,<4",
  "types-PyYAML>=6.0,<7",
]
advanced = [
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "transformers>=4.57,<6",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["reefvision*"]
exclude = ["reefvision.tests*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/reefvision/tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error::DeprecationWarning",
  "error::ResourceWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reefvision"]
mypy_path = "apps/api"
plugins = ["pydantic.mypy"]
exclude = ["apps/api/reefvision/tests/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "boto3",
  "boto3.*",
  "cv2",
  "psutil",
  "segment_anything",
  "segment_anything.*",
  "skimage",
  "skimage.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "ultralytics",
  "ultralytics.*",
]
ignore_missing_imports = true
