[package]
name = "reefvision-windows-automation"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "reefvision"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
